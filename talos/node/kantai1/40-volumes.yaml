---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
encryption:
  provider: luks2
  allowDiscards: true
  keys:
    - slot: 0
      tpm:
        checkSecurebootStatusOnEnroll: true
  options:
    - no_read_workqueue
    - no_write_workqueue
---
apiVersion: v1alpha1
kind: VolumeConfig
name: STATE
encryption:
  provider: luks2
  allowDiscards: true
  keys:
    - slot: 0
      tpm:
        checkSecurebootStatusOnEnroll: true
  options:
    - no_read_workqueue
    - no_write_workqueue
