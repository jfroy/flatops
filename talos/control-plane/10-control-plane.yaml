---
cluster:
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
    advertisedSubnets:
      - 10.1.1.0/24
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
extraArgs:
  disable-admission-plugins: PodSecurity  # cluster uses custom VAPs that model the pod security standards
  enable-aggregator-routing: true
  feature-gates: DRANodeAllocatableResources=true,DRAResourcePoolStatus=true,DRAWorkloadResourceClaims=true,GangScheduling=true,GenericWorkload=true,PodCertificateRequest=true,TopologyAwareWorkloadScheduling=true,WorkloadAwarePreemption=true,WorkloadWithJob=true
  runtime-config: certificates.k8s.io/v1beta1/podcertificaterequests=true,scheduling.k8s.io/v1alpha2=true
---
apiVersion: v1alpha1
kind: KubeAuthenticationConfig
configuration:
  jwt:
    - issuer:
        url: https://pid.kantai.xyz
        audiences:
          - 287821e5-f31e-4073-9b2c-c30775e9fee6
      claimMappings:
        username:
          claim: email
          prefix: ""
---
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: 0.0.0.0
  terminated-pod-gc-threshold: "100"
  feature-gates: DRANodeAllocatableResources=true,DRAResourcePoolStatus=true,DRAWorkloadResourceClaims=true,GangScheduling=true,GenericWorkload=true,PodCertificateRequest=true,TopologyAwareWorkloadScheduling=true,WorkloadAwarePreemption=true,WorkloadWithJob=true
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: 0.0.0.0
  feature-gates: DRANodeAllocatableResources=true,DRAResourcePoolStatus=true,DRAWorkloadResourceClaims=true,GangScheduling=true,GenericWorkload=true,PodCertificateRequest=true,TopologyAwareWorkloadScheduling=true,WorkloadAwarePreemption=true,WorkloadWithJob=true
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeletConfig
config:
  featureGates:
    DRANodeAllocatableResources: true
    DRAResourcePoolStatus: true
    DRAWorkloadResourceClaims: true
    GangScheduling: true
    GenericWorkload: true
    PodCertificateRequest: true
    TopologyAwareWorkloadScheduling: true
    WorkloadAwarePreemption: true
    WorkloadWithJob: true
---
apiVersion: v1alpha1
kind: KubeTalosAPIAccessConfig
allowedRoles:
  - os:admin
  - os:etcd:backup
allowedKubernetesNamespaces:
  - talos-admin
