---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  TOPF_CONFIG_FILE: '{{.TALOS_DIR}}/topf.yaml'
  TOPF_SECRET_FILE: '{{.TALOS_DIR}}/secrets.sops.yaml'
  TOPF_OUTPUT_DIR: '{{.TALOS_DIR}}/output'

tasks:

  nodes:
    desc: List nodes and their current state [HOSTNAME=optional]
    dir: '{{.TALOS_DIR}}'
    cmd: topf nodes {{.FILTER}}
    vars:
      FILTER: '{{if .HOSTNAME}}--nodes-filter ''^{{.HOSTNAME}}$''{{end}}'
    preconditions:
      - &topf {msg: Missing topf, sh: which topf}
      - &config {msg: Missing topf.yaml, sh: 'test -f {{.TOPF_CONFIG_FILE}}'}
      - &secrets {msg: Missing secrets bundle, sh: 'test -f {{.TOPF_SECRET_FILE}}'}
      - &sops {msg: Missing SOPS age key or config, sh: 'test -f "$SOPS_AGE_KEY_FILE" && test -f {{.SOPS_CONFIG_FILE}}'}

  render:
    desc: Render machine configs to talos/output [HOSTNAME=optional, ONLINE=1]
    dir: '{{.TALOS_DIR}}'
    cmds:
      - topf render --output {{.TOPF_OUTPUT_DIR}} {{.FILTER}} {{if .ONLINE}}--online{{end}}
      - cmd: 'echo "NOTE: {{.TOPF_OUTPUT_DIR}} holds cluster secrets in plaintext -- delete it when done."'
        silent: true
    vars:
      FILTER: '{{if .HOSTNAME}}--nodes-filter ''^{{.HOSTNAME}}$''{{end}}'
    preconditions: [*topf, *config, *secrets, *sops]

  diff:
    desc: Diff the rendered config against every node, without applying [HOSTNAME=optional]
    dir: '{{.TALOS_DIR}}'
    cmd: topf apply --dry-run {{.FILTER}}
    vars:
      FILTER: '{{if .HOSTNAME}}--nodes-filter ''^{{.HOSTNAME}}$''{{end}}'
    preconditions: [*topf, *config, *secrets, *sops]

  apply:
    desc: Apply machine configs [HOSTNAME=optional, MODE=auto]
    dir: '{{.TALOS_DIR}}'
    cmd: topf apply --mode={{.MODE}} {{.FILTER}}
    vars:
      MODE: '{{.MODE | default "auto"}}'
      FILTER: '{{if .HOSTNAME}}--nodes-filter ''^{{.HOSTNAME}}$''{{end}}'
    preconditions: [*topf, *config, *secrets, *sops]

  upgrade:
    desc: Upgrade Talos to the version in topf.yaml [HOSTNAME=optional]
    dir: '{{.TALOS_DIR}}'
    cmd: topf upgrade {{.FILTER}}
    vars:
      FILTER: '{{if .HOSTNAME}}--nodes-filter ''^{{.HOSTNAME}}$''{{end}}'
    preconditions: [*topf, *config, *secrets, *sops]

  schematic-ids:
    desc: Print the resolved schematic ID for each node [HOSTNAME=optional]
    dir: '{{.TALOS_DIR}}'
    cmd: topf schematic-ids {{.FILTER}}
    vars:
      FILTER: '{{if .HOSTNAME}}--nodes-filter ''^{{.HOSTNAME}}$''{{end}}'
    preconditions: [*topf, *config]

  talosconfig:
    desc: Regenerate talos/talosconfig from the secrets bundle
    dir: '{{.TALOS_DIR}}'
    cmd: topf talosconfig > {{.TALOSCONFIG}}
    preconditions: [*topf, *config, *secrets, *sops]

  kubeconfig:
    desc: Print a 12h admin kubeconfig (redirect it yourself; does not touch ./kubeconfig)
    dir: '{{.TALOS_DIR}}'
    cmd: topf kubeconfig
    preconditions: [*topf, *config, *secrets, *sops]
