---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app opencode
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      opencode:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          opencode:
            image:
              repository: ghcr.io/anomalyco/opencode
              tag: 1.18.26@sha256:494e9bc5de428686aa6656141f231a67aa4d2e8abd55080367277edb88c3f3ba
            command: ["opencode", "web", "--hostname", "0.0.0.0"]
            env:
              TZ: America/Los_Angeles
              HOME: &home /home/opencode
              OPENCODE_CONFIG: /config/opencode.jsonc
            envFrom:
              - secretRef:
                  name: opencode-litellm
              - secretRef:
                  name: opencode-memini
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 4096
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      opencode:
        ports:
          http:
            port: *port
    route:
      opencode:
        hostnames: ["opencode.kantai.xyz"]
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      home:
        existingClaim: *app
        globalMounts:
          - path: *home
      config-file:
        type: configMap
        name: opencode-config
        globalMounts:
          - path: /config/opencode.jsonc
            subPath: opencode.jsonc
