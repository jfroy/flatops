---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prowlarr-pguser
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: prowlarr-pguser
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: prowlarr
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: prowlarr
        property: POSTGRES_PASSWORD
---
# yaml-language-server: $schema=https://crd.kantai.xyz/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: prowlarr
spec:
  cluster:
    name: pg18vc
  name: prowlarr
  login: true
  passwordSecret:
    name: prowlarr-pguser
---
# yaml-language-server: $schema=https://crd.kantai.xyz/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: prowlarr
spec:
  cluster:
    name: pg18vc
  name: prowlarr-main
  owner: prowlarr
