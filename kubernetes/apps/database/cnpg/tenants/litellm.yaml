---
# yaml-language-server: $schema=https://crd.kantai.xyz/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: litellm
spec:
  cluster:
    name: pg18vc
  name: litellm
  login: true
  inRoles:
    - cert_login
  disablePassword: true
  clientCertificate: {}
---
# yaml-language-server: $schema=https://crd.kantai.xyz/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: litellm
spec:
  cluster:
    name: pg18vc
  name: litellm
  owner: litellm
---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm
spec:
  deletionPolicy: Delete
  refreshInterval: 1h
  secretStoreRefs:
    - kind: SecretStore
      name: push-litellm
  selector:
    secret:
      name: litellm-client-cert
  template:
    type: kubernetes.io/tls
    data:
      identity.p12: '{{ pemToPkcs12 (index . "tls.crt") (index . "tls.key") | b64dec }}'
  dataTo:
    - storeRef:
        name: push-litellm
      remoteKey: litellm-pg
      match:
        regexp: "^(identity\\.p12|tls\\.crt|tls\\.key)$"
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          targetMergePolicy: Ignore
