---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-registry-pguser
spec:
  refreshInterval: "0"
  target:
    name: toolhive-registry-pguser
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: toolhive_registry
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
---
# yaml-language-server: $schema=https://crd.kantai.xyz/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: toolhive-registry-server
spec:
  cluster:
    name: pg18vc
  name: toolhive_registry_server
---
# yaml-language-server: $schema=https://crd.kantai.xyz/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: toolhive-registry
spec:
  cluster:
    name: pg18vc
  name: toolhive_registry
  login: true
  inRoles:
    - toolhive_registry_server
  passwordSecret:
    name: toolhive-registry-pguser
---
# yaml-language-server: $schema=https://crd.kantai.xyz/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: toolhive-registry
spec:
  cluster:
    name: pg18vc
  name: toolhive_registry
  owner: toolhive_registry
---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: toolhive-registry
spec:
  deletionPolicy: Delete
  refreshInterval: 1h
  secretStoreRefs:
    - kind: SecretStore
      name: push-toolhive-system
  selector:
    secret:
      name: toolhive-registry-pguser
  template:
    type: Opaque
    data:
      THV_REGISTRY_DATABASE_PASSWORD: "{{ .password }}"
  dataTo:
    - storeRef:
        name: push-toolhive-system
      remoteKey: toolhive-registry-pg
      match:
        regexp: "^(THV_REGISTRY_DATABASE_PASSWORD)$"
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          targetMergePolicy: Ignore
