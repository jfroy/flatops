---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-pguser
spec:
  refreshInterval: "0"
  target:
    name: immich-pguser
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: immich
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
---
# yaml-language-server: $schema=https://crd.kantai.xyz/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: immich
spec:
  cluster:
    name: pg18vc
  name: immich
  login: true
  passwordSecret:
    name: immich-pguser
---
# yaml-language-server: $schema=https://crd.kantai.xyz/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich
spec:
  cluster:
    name: pg18vc
  name: immich
  owner: immich
  extensions:
    - name: vector
    - name: vchord
    - name: cube
    - name: earthdistance
---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: immich
spec:
  deletionPolicy: Delete
  refreshInterval: 1h
  secretStoreRefs:
    - kind: SecretStore
      name: push-default
  selector:
    secret:
      name: immich-pguser
  template:
    type: Opaque
    data:
      DB_DATABASE_NAME: immich
      DB_HOSTNAME: pg18vc-rw.database.svc.cluster.local
      DB_PASSWORD: "{{ .password }}"
      DB_USERNAME: immich
  dataTo:
    - storeRef:
        name: push-default
      remoteKey: immich-pg
      match:
        regexp: "^(DB_DATABASE_NAME|DB_HOSTNAME|DB_PASSWORD|DB_USERNAME)$"
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          targetMergePolicy: Ignore
