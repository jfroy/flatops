---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-pguser
spec:
  refreshInterval: "0"
  target:
    name: mealie-pguser
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: mealie
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
---
# yaml-language-server: $schema=https://crd.kantai.xyz/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: mealie
spec:
  cluster:
    name: pg18vc
  name: mealie
  login: true
  passwordSecret:
    name: mealie-pguser
---
# yaml-language-server: $schema=https://crd.kantai.xyz/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: mealie
spec:
  cluster:
    name: pg18vc
  name: mealie
  owner: mealie
---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: mealie
spec:
  deletionPolicy: Delete
  refreshInterval: 1h
  secretStoreRefs:
    - kind: SecretStore
      name: push-default
  selector:
    secret:
      name: mealie-pguser
  template:
    type: Opaque
    data:
      POSTGRES_DB: mealie
      POSTGRES_PASSWORD: "{{ .password }}"
      POSTGRES_PORT: "5432"
      POSTGRES_SERVER: pg18vc-rw.database.svc.cluster.local
      POSTGRES_USER: mealie
  dataTo:
    - storeRef:
        name: push-default
      remoteKey: mealie-pg
      match:
        regexp: "^(POSTGRES_DB|POSTGRES_PASSWORD|POSTGRES_PORT|POSTGRES_SERVER|POSTGRES_USER)$"
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          targetMergePolicy: Ignore
