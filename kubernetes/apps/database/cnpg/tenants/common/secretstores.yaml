apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: push-default
spec:
  provider:
    kubernetes:
      remoteNamespace: default
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: pg18vc-push
