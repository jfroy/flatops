---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seerr-pguser
spec:
  refreshInterval: "0"
  target:
    name: seerr-pguser
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: seerr
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
---
# yaml-language-server: $schema=https://crd.kantai.xyz/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: seerr
spec:
  cluster:
    name: pg18vc
  name: seerr
  login: true
  passwordSecret:
    name: seerr-pguser
---
# yaml-language-server: $schema=https://crd.kantai.xyz/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: seerr
spec:
  cluster:
    name: pg18vc
  name: seerr
  owner: seerr
---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: seerr
spec:
  deletionPolicy: Delete
  refreshInterval: 1h
  secretStoreRefs:
    - kind: SecretStore
      name: push-default
  selector:
    secret:
      name: seerr-pguser
  template:
    type: Opaque
    data:
      DB_HOST: pg18vc-rw.database.svc.cluster.local
      DB_NAME: seerr
      DB_PASS: "{{ .password }}"
      DB_PORT: "5432"
      DB_TYPE: postgres
      DB_USER: seerr
  dataTo:
    - storeRef:
        name: push-default
      remoteKey: seerr-pg
      match:
        regexp: "^(DB_HOST|DB_NAME|DB_PASS|DB_PORT|DB_TYPE|DB_USER)$"
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          targetMergePolicy: Ignore
