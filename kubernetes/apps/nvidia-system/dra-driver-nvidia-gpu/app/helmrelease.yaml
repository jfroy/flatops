---
# yaml-language-server: $schema=https://crd.kantai.xyz/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dra-driver-nvidia-gpu
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: dra-driver-nvidia-gpu
  values:
    nvidiaDriverRoot: /usr/local
    # Acknowledges gpu-operator devicePlugin.enabled=false; see docs/gpu-dra.md.
    gpuResourcesEnabledOverride: true
    resources:
      gpus:
        enabled: true
      computeDomains:
        enabled: false
    featureGates:
      ConsumableShares: true
    # Uncapped sharing, replacing time-slicing; see docs/gpu-dra.md.
    consumableShares: unlimited
