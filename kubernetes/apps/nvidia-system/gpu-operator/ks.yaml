---
# yaml-language-server: $schema=https://crd.kantai.xyz/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gpu-operator
spec:
  path: ./kubernetes/apps/nvidia-system/gpu-operator/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: nvidia-system-gpu-operator
    namespace: flux-system
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 5m
