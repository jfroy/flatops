---
# yaml-language-server: $schema=https://crd.kantai.xyz/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: gpu-operator
  install:
    disableOpenAPIValidation: true
  upgrade:
    disableOpenAPIValidation: true
  values:
    dcgmExporter:
      env:
        # Map metrics to pods through DRA ResourceClaims instead of the device
        # plugin's pod-resources view. Needs read access to resource.k8s.io,
        # which the operator does not grant; see rbac.yaml.
        - name: KUBERNETES_ENABLE_DRA
          value: "true"
      serviceMonitor:
        enabled: true
        honorLabels: true
        relabelings:
          - sourceLabels: ["__meta_kubernetes_pod_node_name"]
            regex: (.*)
            targetLabel: instance
            replacement: $1
            action: replace
    # Exactly one whole-GPU advertiser per node: dra-driver-nvidia-gpu publishes
    # the GPU, so the device plugin must stay off. The two allocators keep
    # independent ledgers and would double-allocate the same card.
    devicePlugin:
      enabled: false
    # Talos ships the driver and container toolkit as system extensions. The
    # driver root is /usr/local and must match the DRA driver's
    # nvidiaDriverRoot.
    driver:
      enabled: false
    hostPaths:
      driverInstallDir: /usr/local
    nfd:
      enabled: false
    toolkit:
      enabled: false
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: gpu-operator
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: gpu-operator
              spec:
                template:
                  spec:
                    containers:
                      - name: gpu-operator
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities: { drop: ["ALL"] }
                          readOnlyRootFilesystem: true
                          runAsNonRoot: true
                          runAsUser: 1000
                          runAsGroup: 1000
                    securityContext:
                      fsGroup: 1000
                      fsGroupChangePolicy: OnRootMismatch
