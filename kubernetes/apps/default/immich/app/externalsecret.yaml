# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-valkey
spec:
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: immich-valkey
    template:
      data:
          REDIS_URL: |
            ioredis://{{- (dict "host" "immich-valkey.default.svc.cluster.local" "password" .REDIS_PASSWORD "tls" (dict)) | toJson | b64enc -}}
          REDIS_PASSWORD: "{{ .REDIS_PASSWORD }}"
          valkey.conf: |
            requirepass {{ .REDIS_PASSWORD }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
      rewrite:
        - regexp:
            source: "password"
            target: "REDIS_PASSWORD"
