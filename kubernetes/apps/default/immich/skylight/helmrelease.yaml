---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-skylight
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      immich-skylight:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          immich-skylight:
            image:
              repository: ghcr.io/jfroy/immich-skylight
              tag: 0.2.0@sha256:7e34a030f39d3ad5cbe86b99b0d154f609251ea8f5bee0862776372a6b3f3e11
            args: [run]
            env:
              HTTP_ADDR: :8080
              IMMICH_FAVORITES: "false"
              IMMICH_IMAGE_SOURCE: preview
              IMMICH_TAGS: Skylight
              IMMICH_URL: http://immich-server.default.svc.cluster.local:2283
              LOG_LEVEL: info
              OTEL_SERVICE_NAME: immich-skylight
              PRUNE_FRAME_TAGS: "true"
              REMOVE_UNSELECTED: "true"
              STATE_FILE: /data/state.db
              SYNC_INTERVAL: 15m
              TZ: America/Los_Angeles
            envFrom:
              - secretRef:
                  name: immich-skylight
              - secretRef:
                  name: immich-skylight-webhook
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &httpPort 8080
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *httpPort
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  failureThreshold: 6
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
              runAsNonRoot: true
        pod:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
    persistence:
      data:
        existingClaim: "${APP}"
        globalMounts:
          - path: /data
    service:
      immich-skylight:
        controller: immich-skylight
        ports:
          http:
            port: *httpPort
    serviceMonitor:
      immich-skylight:
        serviceName: immich-skylight
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
