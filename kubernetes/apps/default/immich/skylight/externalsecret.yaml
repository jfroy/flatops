---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-skylight
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: immich-skylight
  data:
    - secretKey: IMMICH_API_KEY
      remoteRef:
        key: immich-skylight
        property: immich_api_key
    - secretKey: SKYLIGHT_EMAIL
      remoteRef:
        key: immich-skylight
        property: skylight_email
    - secretKey: SKYLIGHT_PASSWORD
      remoteRef:
        key: immich-skylight
        property: skylight_password
---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-skylight-webhook
spec:
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: immich-skylight-webhook
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
      rewrite:
        - regexp:
            source: "password"
            target: "WEBHOOK_SECRET"
