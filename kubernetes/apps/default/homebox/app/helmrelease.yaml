---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homebox
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      homebox:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          homebox:
            image:
              repository: ghcr.io/sysadminsmedia/homebox
              tag: 0.26.2@sha256:b1ad7e3c63f732a5f6daa466e8116be4f545b3b120383a64dcb62beb00a660cc
            env:
              HBOX_DATABASE_DATABASE: homebox
              HBOX_DATABASE_HOST: pg18vc-rw.database.svc.cluster.local
              HBOX_DATABASE_PORT: "5432"
              HBOX_DATABASE_SSL_CERT: /etc/postgresql/client/tls.crt
              HBOX_DATABASE_SSL_KEY: /etc/postgresql/client/tls.key
              HBOX_DATABASE_SSL_ROOT_CERT: /etc/postgresql/ca/ca.crt
              HBOX_DATABASE_USERNAME: homebox
              HBOX_OPTIONS_CHECK_GITHUB_RELEASE: "false"
              HBOX_DATABASE_DRIVER: postgres
              HBOX_DATABASE_SSL_MODE: verify-full
              HBOX_LOG_FORMAT: json
              HBOX_LOG_LEVEL: info
              HBOX_OIDC_ISSUER_URL: https://pid.kantai.xyz
              HBOX_OIDC_BUTTON_TEXT: "Sign in with Pocket ID"
              HBOX_OPTIONS_TRUST_PROXY: "true"
              HBOX_OPTIONS_GITHUB_RELEASE_CHECK: "false"
              HBOX_OPTIONS_ALLOW_LOCAL_LOGIN: "false"
              HBOX_OIDC_ENABLED: "true"
              HBOX_OPTIONS_HOSTNAME: homebox.kantai.xyz
              HBOX_WEB_PORT: &port 7745
              TZ: America/Los_Angeles
            envFrom:
              - secretRef:
                  name: homebox
              - secretRef:
                  name: homebox-keys
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      data:
        existingClaim: ${APP}
      modcache:
        type: emptyDir
        sizeLimit: 100Mi
        globalMounts:
          - path: /.cache
      pg-ca:
        type: configMap
        name: cluster-ca.crt
        globalMounts:
          - path: /etc/postgresql/ca
            readOnly: true
      pg-client:
        type: secret
        name: homebox-pg
        defaultMode: 0440
        globalMounts:
          - path: /etc/postgresql/client
            readOnly: true
    route:
      homebox:
        hostnames:
          - homebox.kantai.xyz
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - port: *port
                name: homebox
    service:
      homebox:
        controller: homebox
        type: ClusterIP
        ports:
          http:
            port: *port
