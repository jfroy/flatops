---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tracearr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      tracearr:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          valkey:
            image:
              repository: ghcr.io/valkey-io/valkey
              tag: 9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
            args:
              - --save
              - ""
              - --port
              - "6379"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - valkey-cli
                      - ping
            restartPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
        containers:
          tracearr:
            image:
              repository: ghcr.io/connorgallopo/tracearr
              tag: 2.7.0@sha256:bd40bf5d0e09da50208e3005671dee952a55dbc1ae1ec1f5e37e9d7cc72399f8
            env:
              CORS_ORIGIN: "https://tracearr.kantai.xyz"
              DATABASE_URL: "postgres://tracearr@pg18vc-rw.database.svc.cluster.local:5432/tracearr?sslmode=verify-full&sslrootcert=/etc/postgresql/ca/ca.crt&sslcert=/etc/postgresql/client/tls.crt&sslkey=/etc/postgresql/client/tls.key"
              HOST: "0.0.0.0"
              NODE_ENV: production
              PORT: &port 3000
              REDIS_URL: redis://localhost:6379
              TZ: America/Los_Angeles
            envFrom:
              - secretRef:
                  name: tracearr-keys
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
    persistence:
      pg-ca:
        type: configMap
        name: cluster-ca.crt
        advancedMounts:
          tracearr:
            tracearr:
              - path: /etc/postgresql/ca
                readOnly: true
      pg-client:
        type: secret
        name: tracearr-pg
        defaultMode: 0440
        advancedMounts:
          tracearr:
            tracearr:
              - path: /etc/postgresql/client
                readOnly: true
      tmp:
        type: emptyDir
        sizeLimit: 5Gi
        advancedMounts:
          tracearr:
            tracearr:
            - path: /app/data/image-cache
              subPath: image-cache
            - path: /tmp
              subPath: tmp
      valkey-data:
        type: emptyDir
        sizeLimit: 1Mi
        advancedMounts:
          tracearr:
            valkey:
              - path: /data
    route:
      tracearr:
        hostnames: ["tracearr.kantai.xyz"]
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      tracearr:
        controller: tracearr
        ports:
          http:
            port: *port
