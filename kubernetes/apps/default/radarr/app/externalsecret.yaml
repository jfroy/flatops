---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: radarr-secret
    template:
      data:
        RADARR__AUTH__APIKEY: "{{ .API_KEY }}"
        RADARR__POSTGRES__HOST: pg18vc-rw.database.svc.cluster.local
        RADARR__POSTGRES__MAINDB: radarr-main
        RADARR__POSTGRES__PASSWORD: "{{ .POSTGRES_PASSWORD }}"
        RADARR__POSTGRES__PORT: "5432"
        RADARR__POSTGRES__USER: radarr
  dataFrom:
    - extract:
        key: radarr
