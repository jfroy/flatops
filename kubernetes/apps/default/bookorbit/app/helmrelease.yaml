---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bookorbit
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    configMaps:
      initdb:
        data:
          bookorbit.sql: |
            CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
            CREATE EXTENSION IF NOT EXISTS "pg_trgm";
            CREATE EXTENSION IF NOT EXISTS "vector";
    controllers:
      bookorbit:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            envFrom:
              - secretRef:
                  name: bookorbit-db
              - secretRef:
                  name: bookorbit-initdb
        containers:
          bookorbit:
            image:
              repository: ghcr.io/bookorbit/bookorbit
              tag: 2.6.0@sha256:a7fa6d124d99bb5cda302160be0736b67e858f6957153e711edbba19e1b93057
            env:
              APP_URL: https://bookorbit.kantai.xyz
              CLIENT_URL: https://bookorbit.kantai.xyz
              NODE_ENV: production
              NODE_MAX_OLD_SPACE_SIZE: 2048
              OIDC_ALLOW_LOCAL_ISSUERS: true
              PORT: &port 3000
              TZ: America/Los_Angeles
            envFrom:
              - secretRef:
                  name: bookorbit
              - secretRef:
                  name: bookorbit-db
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    persistence:
      data:
        existingClaim: "${APP}"
        advancedMounts:
          bookorbit:
            bookorbit:
              - path: /data
      initdb:
        type: configMap
        identifier: initdb
        advancedMounts:
          bookorbit:
            init-db:
              - path: /initdb
      media2:
        type: persistentVolumeClaim
        existingClaim: media2
        advancedMounts:
          bookorbit:
            bookorbit:
              - path: /books
                subPath: library/books
              - path: /manga
                subPath: library/manga
              - path: /manga-adult
                subPath: library/manga-adult
      tmp:
        type: emptyDir
    route:
      bookorbit:
        hostnames: ["bookorbit.kantai.xyz"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - port: *port
                name: bookorbit
    service:
      bookorbit:
        controller: bookorbit
        ports:
          http:
            port: *port
