---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bookorbit
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      bookorbit:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          bookorbit:
            image:
              repository: ghcr.io/bookorbit/bookorbit
              tag: 3.2.0@sha256:1020eef9f004be972ac60e79dd5f416129f0d3d91491b803aa8fa656acb2b6a6
            env:
              APP_URL: https://bookorbit.kantai.xyz
              CLIENT_URL: https://bookorbit.kantai.xyz
              NODE_ENV: production
              NODE_MAX_OLD_SPACE_SIZE: 2048
              OIDC_ALLOW_LOCAL_ISSUERS: true
              PORT: &port 3000
              TZ: America/Los_Angeles
            envFrom:
              - secretRef:
                  name: bookorbit
              - secretRef:
                  name: bookorbit-pg
              - secretRef:
                  name: bookorbit-keys
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    persistence:
      data:
        existingClaim: "${APP}"
        advancedMounts:
          bookorbit:
            bookorbit:
              - path: /data
      media2:
        type: persistentVolumeClaim
        existingClaim: media2
        advancedMounts:
          bookorbit:
            bookorbit:
              - path: /books
                subPath: library/books
              - path: /manga
                subPath: library/manga
              - path: /manga-adult
                subPath: library/manga-adult
              - path: /media2/qbittorrent/complete/books
                subPath: qbittorrent/complete/books
              - path: /media2/sabnzbd/complete/books
                subPath: sabnzbd/complete/books
      tmp:
        type: emptyDir
    route:
      bookorbit:
        hostnames: ["bookorbit.kantai.xyz"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - port: *port
                name: bookorbit
    service:
      bookorbit:
        controller: bookorbit
        ports:
          http:
            port: *port
