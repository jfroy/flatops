---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: netbox
  values:
    commonAnnotations:
      reloader.stakater.com/auto: "true"
    superuser:
      name: jfroy
      email: jf@lesroy.net
    admins:
      - ["jfroy", "jf@lesroy.net"]
    loginRequired: true
    email:
      server: etampe.default.svc.cluster.local
      port: 2525
      from: "netbox@kantai.xyz"
    remoteAuth:
      enabled: true
      backends:
        - social_core.backends.open_id_connect.OpenIdConnectAuth
      autoCreateUser: true
    extraConfig:
      - values:
          SOCIAL_AUTH_OIDC_OIDC_ENDPOINT: https://pid.kantai.xyz
          SOCIAL_AUTH_OIDC_KEY: b81b4d7b-b011-4cbc-8396-79fd40a6fa1e
          SOCIAL_AUTH_OIDC_SCOPE:
            - openid
            - profile
            - email
      - secret:
          secretName: netbox-oidc
          items:
            - key: oidc.yaml
              path: oidc.yaml
    storages:
      default:
        BACKEND: storages.backends.s3.S3Storage
        OPTIONS:
          bucket_name: netbox
          endpoint_url: https://s3.kantai.xyz
          region_name: auto
          verify: /certs/ca-certificates.crt
    plugins: []
    preferIPv4: true
    releaseCheck:
      url: null
    timeZone: America/Los_Angeles
    persistence:
      enabled: true
      existingClaim: netbox
    initContainers:
      - name: init-db
        image: ghcr.io/home-operations/postgres-init:18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
        envFrom:
          - secretRef:
              name: netbox-db
          - secretRef:
              name: netbox-initdb
    extraVolumes:
      - name: ca-certificates
        configMap:
          name: cluster-ca-certificates.crt
    extraVolumeMounts:
      - name: ca-certificates
        mountPath: /certs
        readOnly: true
    resourcesPreset: none
    metrics:
      enabled: true
      granian:
        enabled: true
        serviceMonitor:
          enabled: true
    httpRoute:
      enabled: true
      parentRefs:
        - name: envoy-internal
          namespace: network
      hostnames:
        - "${APP_SUBDOMAIN:-${APP}}.kantai.xyz"
    postgresql:
      enabled: false
    externalDatabase:
      host: pg18vc-rw.database.svc.cluster.local
      port: 5432
      database: netbox
      username: netbox
      existingSecretName: netbox-db
      existingSecretKey: DB_PASSWORD
    valkey:
      enabled: false
    tasksDatabase:
      host: netbox-valkey.default.svc.cluster.local
      port: 6379
      database: 0
      existingSecretName: netbox-valkey
      existingSecretKey: VALKEY_PASSWORD
    cachingDatabase:
      host: netbox-valkey.default.svc.cluster.local
      port: 6379
      database: 1
      existingSecretName: netbox-valkey
      existingSecretKey: VALKEY_PASSWORD
    housekeeping:
      enabled: true
    worker:
      enabled: true
  valuesFrom:
    - targetPath: storages.default.OPTIONS.access_key
      kind: Secret
      name: netbox-obc
      valuesKey: AWS_ACCESS_KEY_ID
    - targetPath: storages.default.OPTIONS.secret_key
      kind: Secret
      name: netbox-obc
      valuesKey: AWS_SECRET_ACCESS_KEY
