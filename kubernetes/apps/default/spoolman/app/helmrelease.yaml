---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spoolman
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      spoolman:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          spoolman:
            image:
              repository: ghcr.io/donkie/spoolman
              tag: 0.27.1@sha256:1ebb4f6a62c2e72a07f18b07ebfdbd96322f5bc2eb72570af3088f68d7c393b1
            command:
              - uvicorn
              - spoolman.main:app
              - --host
              - 0.0.0.0
              - --port
              - "8000"
            env:
              PGSSLCERT: /etc/postgresql/client/tls.crt
              PGSSLKEY: /etc/postgresql/client/tls.key
              PGSSLMODE: verify-full
              PGSSLROOTCERT: /etc/postgresql/ca/ca.crt
              SPOOLMAN_DB_HOST: pg18vc-rw.database.svc.cluster.local
              SPOOLMAN_DB_NAME: spoolman
              SPOOLMAN_DB_PORT: "5432"
              SPOOLMAN_DB_TYPE: postgres
              SPOOLMAN_DB_USERNAME: spoolman
              SPOOLMAN_METRICS_ENABLED: "true"
              TZ: America/Los_Angeles
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      data:
        existingClaim: ${APP}
        globalMounts:
          - path: /home/app/.local/share/spoolman
      pg-ca:
        type: configMap
        name: cluster-ca.crt
        globalMounts:
          - path: /etc/postgresql/ca
            readOnly: true
      pg-client:
        type: secret
        name: spoolman-pg
        defaultMode: 0440
        globalMounts:
          - path: /etc/postgresql/client
            readOnly: true
    route:
      spoolman:
        hostnames:
          - "${APP_SUBDOMAIN:-${APP}}.kantai.xyz"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: spoolman
                port: &port 8000
    service:
      spoolman:
        controller: spoolman
        type: ClusterIP
        ports:
          http:
            port: *port
    serviceMonitor:
      spoolman:
        serviceName: spoolman
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
            metricRelabelings:
              - action: labeldrop
                regex: (pod)
