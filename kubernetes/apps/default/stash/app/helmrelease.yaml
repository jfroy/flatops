---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stash
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      stash:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          stash:
            image:
              repository: ghcr.io/jfroy/stash
              tag: v0.31.1-cudajellyfin@sha256:720df0459b84722d086cf6cacb2248d451aa7491eba13d88c1c956f052df21e0
            env:
              HOME: /config
              STASH_BLOBS_PATH: /blobs
              STASH_BLOBS_STORAGE: FILESYSTEM
              STASH_CACHE: /cache
              STASH_CONFIG_FILE: /config/config.yml
              STASH_DATABASE: /config/stash-go.sqlite
              STASH_GENERATED: /generated
              STASH_HW_TEST_TIMEOUT: "10"
              STASH_PLUGINS_PATH: /plugins
              STASH_PORT: &port 9999
              STASH_SCRAPERS_PATH: /scrapers
              TZ: America/Los_Angeles
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
            resources:
              requests:
                nvidia.com/gpu: 1
              limits:
                nvidia.com/gpu: 1
            workingDir: /config
        initContainers:
          install-plugins:
            image:
              repository: ghcr.io/instrumentisto/rsync-ssh
              tag: alpine3.22
            command: ["/usr/bin/rsync", "-a", "/install/", "/plugins/managed/"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        pod:
          hostname: stash
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups: [4000]
    configMaps:
      dockerenv:
        data:
          dockerenv: ""
    persistence:
      bulk-transcode-plugin:
        type: image
        image: registry.kantai.xyz/stash/bulk-transcode:latest@sha256:ef916bda71586294a8ebdf2ef32815def4cf7baca8ec77855a0c53bd06e81bfe
        advancedMounts:
          stash:
            install-plugins:
              - path: /install/bulk_transcode
      cache:
        type: emptyDir
        advancedMounts:
          stash:
            stash:
              - path: /cache
                subPath: stash
      config:
        existingClaim: ${APP}
        advancedMounts:
          stash:
            stash:
              - path: /config
      data:
        type: persistentVolumeClaim
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        retain: true
        size: 1Ti
        advancedMounts:
          stash:
            stash:
              - path: /blobs
                subPath: blobs
              - path: /generated
                subPath: generated
      dockerenv:
        type: configMap
        identifier: dockerenv
        globalMounts:
          - path: /.dockerenv
            subPath: dockerenv
      plugins:
        type: persistentVolumeClaim
        storageClass: openebs-hostpath
        accessMode: ReadWriteOnce
        retain: true
        size: 100Mi
        advancedMounts:
          stash:
            install-plugins:
              - path: /plugins
            stash:
              - path: /plugins
      scrapers:
        type: persistentVolumeClaim
        storageClass: openebs-hostpath
        accessMode: ReadWriteOnce
        retain: true
        size: 100Mi
        advancedMounts:
          stash:
            stash:
              - path: /scrapers
      sss:
        type: persistentVolumeClaim
        existingClaim: media1
        globalMounts:
          - path: /mnt/citerne/media
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 100Mi
    route:
      stash:
        hostnames:
          - "${APP_SUBDOMAIN:-${APP}}.kantai.xyz"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - port: *port
                identifier: stash
    service:
      stash:
        controller: stash
        forceRename: "{{ .Release.Name }}"
        ports:
          http:
            port: *port
