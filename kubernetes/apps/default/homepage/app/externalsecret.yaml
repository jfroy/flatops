---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: homepage-secret
  data:
    - secretKey: HOMEPAGE_OIDC_CLIENT_ID
      remoteRef:
        key: homepage-oidc
        property: client-id
    - secretKey: HOMEPAGE_OIDC_CLIENT_SECRET
      remoteRef:
        key: homepage-oidc
        property: client-secret
    - secretKey: HOMEPAGE_VAR_CHANGE_DETECTION_API_KEY
      remoteRef:
        key: changedetection
        property: credential
    - secretKey: HOMEPAGE_VAR_FINNHUB_API_KEY
      remoteRef:
        key: finnhub-io
        property: credential
    - secretKey: HOMEPAGE_VAR_IMMICH_API_KEY
      remoteRef:
        key: immich
        property: credential
    - secretKey: HOMEPAGE_VAR_NEXTDNS_API_KEY
      remoteRef:
        key: nextdns
        property: credential
    - secretKey: HOMEPAGE_VAR_NEXTDNS_PROFILE
      remoteRef:
        key: nextdns
        property: profile
    - secretKey: HOMEPAGE_VAR_PLEX_API_KEY
      remoteRef:
        key: plex
        property: DEVICE_TOKEN
    - secretKey: HOMEPAGE_VAR_PROWLARR_API_KEY
      remoteRef:
        key: prowlarr
        property: API_KEY
    - secretKey: HOMEPAGE_VAR_RADARR_API_KEY
      remoteRef:
        key: radarr
        property: API_KEY
    - secretKey: HOMEPAGE_VAR_SAB_API_KEY
      remoteRef:
        key: sabnzbd
        property: API_KEY
    - secretKey: HOMEPAGE_VAR_SONARR_API_KEY
      remoteRef:
        key: sonarr
        property: API_KEY
    - secretKey: HOMEPAGE_VAR_STASH_API_KEY
      remoteRef:
        key: stash
        property: credential
    - secretKey: HOMEPAGE_VAR_UNIFI_API_KEY
      remoteRef:
        key: unifi
        property: credential
---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-auth
spec:
  # Rotating this signing key invalidates every live session.
  refreshPolicy: CreatedOnce
  target:
    name: homepage-auth
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password64
      rewrite:
        - regexp:
            source: "password"
            target: "HOMEPAGE_AUTH_SECRET"
