---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      homepage:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          homepage:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.2.0@sha256:753eeb0cc22ab7baad39ed47cbd1aae14e193dd1b264e965f193a9ea1d1e1bdd
            env:
              HOMEPAGE_ALLOWED_HOSTS: "${APP_SUBDOMAIN:-${APP}}.kantai.xyz"
              HOMEPAGE_AUTH_ENABLED: "true"
              HOMEPAGE_EXTERNAL_URL: https://${APP_SUBDOMAIN:-${APP}}.kantai.xyz
              HOMEPAGE_OIDC_ISSUER: https://pid.kantai.xyz
              HOMEPAGE_OIDC_NAME: Pocket ID
              NODE_OPTIONS: "--max-http-header-size=65536"
              PUID: 1000
              PGID: 1000
              TZ: America/Los_Angeles
            envFrom:
              - secretRef:
                  name: homepage-secret
              - secretRef:
                  name: homepage-auth
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthcheck
                    port: &port 3000
                    httpHeaders:
                      # HOMEPAGE_ALLOWED_HOSTS is validated before the
                      # /api/healthcheck auth exemption, and kubelet would
                      # otherwise send the pod IP as Host and get a 400.
                      - name: Host
                        value: localhost:3000
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
        serviceAccount:
          identifier: homepage
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      cache:
        type: emptyDir
        sizeLimit: 100Mi
        globalMounts:
          - path: /app/.next/cache
      homepage-config:
        type: configMap
        name: homepage-config
        globalMounts:
          - path: /app/config
      logs:
        type: emptyDir
        sizeLimit: 100Mi
        globalMounts:
          - path: /app/config/logs
      tmp:
        type: emptyDir
        sizeLimit: 100Mi
        globalMounts:
          - path: /tmp
    route:
      homepage:
        hostnames:
          - "${APP_SUBDOMAIN:-${APP}}.kantai.xyz"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - port: *port
                name: homepage
    service:
      homepage:
        controller: homepage
        type: ClusterIP
        ports:
          http:
            port: *port
    serviceAccount:
      homepage: {}
