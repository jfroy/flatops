---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mealie
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      mealie:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.4.0@sha256:ebd9d30add17acdf935d73eb004758c7dfd9388aaa605fda70ad74378ab92aec
            envFrom:
              - secretRef:
                  name: mealie-db
              - secretRef:
                  name: mealie-initdb
        containers:
          mealie:
            image:
              repository: ghcr.io/mealie-recipes/mealie
              tag: v3.22.0@sha256:36c28f0642fb6c75fae8997a2d55994631b9b4bcffba3016c208fc132a4c1e69
            env:
              ALLOW_PASSWORD_LOGIN: "true"
              ALLOW_SIGNUP: "false"
              API_PORT: &port 9000
              BASE_URL: https://mealie.kantai.xyz
              DB_ENGINE: postgres
              OIDC_ADMIN_GROUP: mealie_admins
              OIDC_AUTH_ENABLED: "true"
              OIDC_CLIENT_ID: 3409db10-3155-4d9c-bae5-f9d7eb4d02c8
              OIDC_CONFIGURATION_URL: https://pid.kantai.xyz/.well-known/openid-configuration
              OIDC_PROVIDER_NAME: Pocket ID
              OIDC_REMEMBER_ME: "true"
              OIDC_SIGNUP_ENABLED: "true"
              SMTP_AUTH_STRATEGY: NONE
              SMTP_FROM_EMAIL: mealie@kantai.xyz
              SMTP_FROM_NAME: Mealie
              SMTP_HOST: etampe.default.svc.cluster.local
              SMTP_PORT: "2525"
              TZ: America/Los_Angeles
            envFrom:
              - secretRef:
                  name: mealie
              - secretRef:
                  name: mealie-db
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/app/about
                    port: *port
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 911
            runAsGroup: 911
            fsGroup: 911
            fsGroupChangePolicy: OnRootMismatch
    persistence:
      data:
        existingClaim: ${APP}
        advancedMounts:
          mealie:
            mealie:
              - path: /app/data
    route:
      mealie:
        hostnames:
          - mealie.kantai.xyz
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: mealie
                port: *port
            matches:
              - path:
                  type: PathPrefix
                  value: /
    service:
      mealie:
        controller: mealie
        ports:
          http:
            port: *port
