---
# yaml-language-server: $schema=https://crd.kantai.xyz/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mealie
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: pg18vc-mealie
      namespace: database
  path: ./kubernetes/apps/default/mealie/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: default-mealie
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 100Mi
