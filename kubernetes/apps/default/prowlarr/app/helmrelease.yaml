---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      prowlarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          prowlarr:
            image:
              repository: ghcr.io/home-operations/prowlarr
              tag: 2.6.6.5717@sha256:8ead2b6f1b5d744fc52849d455896809b2d290f2b78b05f1b3fb21f410866b58
            env:
              PROWLARR__APP__INSTANCENAME: Prowlarr
              PROWLARR__APP__THEME: auto
              PROWLARR__AUTH__METHOD: External
              PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses
              PROWLARR__LOG__DBENABLED: "False"
              PROWLARR__POSTGRES__MAINDBCONNECTIONSTRING: "Host=pg18vc-rw.database.svc.cluster.local;Port=5432;Database=prowlarr-main;Username=prowlarr;SSL Mode=VerifyFull;Root Certificate=/etc/postgresql/ca/ca.crt;SSL Certificate=/etc/postgresql/client/tls.crt;SSL Key=/etc/postgresql/client/tls.key"
              PROWLARR__SERVER__ALLOWEDHOSTS: "prowlarr.kantai.xyz,prowlarr,prowlarr.default,prowlarr.default.svc,prowlarr.default.svc.cluster.local"
              PROWLARR__SERVER__PORT: &port 80
              PROWLARR__UPDATE__BRANCH: develop
              TZ: America/Los_Angeles
            envFrom:
              - secretRef:
                  name: prowlarr-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                    # Host filtering rejects the kubelet's default Host of the pod IP.
                    httpHeaders:
                      - name: Host
                        value: localhost
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [4000]
    persistence:
      config:
        type: emptyDir
      pg-ca:
        type: configMap
        name: cluster-ca.crt
        globalMounts:
          - path: /etc/postgresql/ca
            readOnly: true
      pg-client:
        type: secret
        name: prowlarr-pg
        defaultMode: 0440
        globalMounts:
          - path: /etc/postgresql/client
            readOnly: true
      tmp:
        type: emptyDir
    route:
      prowlarr:
        hostnames:
          - "${APP_SUBDOMAIN:-${APP}}.kantai.xyz"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - port: *port
                name: prowlarr
    service:
      prowlarr:
        controller: prowlarr
        ports:
          http:
            port: *port
