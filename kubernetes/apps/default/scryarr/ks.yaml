---
# yaml-language-server: $schema=https://crd.kantai.xyz/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app scryarr
spec:
  dependsOn:
    - name: scryer
  path: ./kubernetes/apps/default/scryarr/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: default-scryarr
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
