---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scryarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      scryarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          scryarr:
            image:
              repository: ghcr.io/jfroy/scryarr
              tag: 0.1.0@sha256:3fa36fd3e77acfe40ce06b2d69ef07736dd4d25713a87043140d07bcf693505c
            env:
              SCRYARR_DATA_DIR: /data
              SCRYER_URL: http://scryer.default.svc.cluster.local:8080
              TZ: America/Los_Angeles
            envFrom:
              - secretRef:
                  name: scryarr-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: ceph-block
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
    service:
      scryarr:
        controller: scryarr
        ports:
          http:
            port: *port
