---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dawarich
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      dawarich:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          valkey:
            image:
              repository: ghcr.io/valkey-io/valkey
              tag: 9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
            args:
              - --save
              - ""
              - --port
              - "6379"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - valkey-cli
                      - ping
            restartPolicy: Always
            securityContext: &sc
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
        containers:
          app:
            image:
              repository: mirror.gcr.io/freikin/dawarich
              tag: 1.18.0
            command: ["web-entrypoint.sh"]
            args: ["bin/rails", "server", "-p", "3000", "-b", "::"]
            env: &env
              APPLICATION_HOSTS: "{{ .Release.Name }}.kantai.xyz"
              APPLICATION_PROTOCOL: http
              DATABASE_HOST: pg18vc-rw.database.svc.cluster.local
              DATABASE_NAME: dawarich
              DATABASE_USERNAME: dawarich
              DISTANCE_UNIT: km
              MIN_MINUTES_SPENT_IN_CITY: 60
              OIDC_ISSUER: https://pid.kantai.xyz
              OIDC_REDIRECT_URI: "https://{{ .Release.Name }}.kantai.xyz/users/auth/openid_connect/callback"
              PGSSLCERT: /etc/postgresql/client/tls.crt
              PGSSLKEY: /etc/postgresql/client/tls.key
              PGSSLMODE: verify-full
              PGSSLROOTCERT: /etc/postgresql/ca/ca.crt
              PHOTON_API_HOST: photon.default.svc.cluster.local:2322
              PHOTON_API_USE_HTTPS: false
              RAILS_ENV: production
              REDIS_URL: redis://localhost:6379
              SELF_HOSTED: true
              TIME_ZONE: America/Los_Angeles
              TZ: America/Los_Angeles
            envFrom: &envFrom
              - secretRef:
                  name: dawarich
              - secretRef:
                  name: dawarich-keys
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 3000
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 3000
                  periodSeconds: 10
                  failureThreshold: 90
            securityContext: *sc
          sidekick:
            image:
              repository: mirror.gcr.io/freikin/dawarich
              tag: 1.18.0@sha256:e22d39339a00ab03b057a75897a8950dfd5d084e0f23202a7c6d5e8814f96aff
            command: ["sidekiq-entrypoint.sh"]
            args: []
            env: *env
            envFrom: *envFrom
            securityContext: *sc
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
    persistence:
      data:
        existingClaim: ${APP}
        advancedMounts:
          dawarich:
            app: &mounts
              - path: /var/app/public
                subPath: public
              - path: /var/app/storage
                subPath: storage
              - path: /dawarich_db_data
                subPath: dawarich_db_data
            sidekick: *mounts
      pg-ca:
        type: configMap
        name: cluster-ca.crt
        advancedMounts:
          dawarich:
            app:
              - path: /etc/postgresql/ca
                readOnly: true
            sidekick:
              - path: /etc/postgresql/ca
                readOnly: true
      pg-client:
        type: secret
        name: dawarich-pg
        defaultMode: 0440
        advancedMounts:
          dawarich:
            app:
              - path: /etc/postgresql/client
                readOnly: true
            sidekick:
              - path: /etc/postgresql/client
                readOnly: true
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 100Mi
        advancedMounts:
          dawarich:
            app: &mounts
              - path: /tmp
                subPath: tmp
              - path: /var/app/tmp
                subPath: app
            sidekick: *mounts
            valkey:
              - path: /data
                subPath: valkey-data
      watched:
        type: emptyDir
        sizeLimit: 100Mi
        advancedMounts:
          dawarich:
            app: &mounts
              - path: /var/app/tmp/imports/watched
            sidekick: *mounts
    route:
      dawarich:
        hostnames: ["{{ .Release.Name }}.kantai.xyz"]
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      dawarich:
        controller: dawarich
        ports:
          http:
            port: 3000
