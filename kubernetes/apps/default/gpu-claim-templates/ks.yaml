---
# yaml-language-server: $schema=https://crd.kantai.xyz/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gpu-claim-templates
spec:
  path: ./kubernetes/apps/default/gpu-claim-templates/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: default-gpu-claim-templates
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
