---
# yaml-language-server: $schema=https://crd.kantai.xyz/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tofa-allow-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tofa
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "33333"
              protocol: TCP
