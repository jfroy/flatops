---
# yaml-language-server: $schema=https://crd.kantai.xyz/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zipline
spec:
  dependsOn:
    - name: pg18vc-zipline
      namespace: database
  path: ./kubernetes/apps/default/zipline/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: default-zipline
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
