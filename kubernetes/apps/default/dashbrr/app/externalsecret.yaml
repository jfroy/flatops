---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dashbrr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: dashbrr
  data:
    - secretKey: DASHBRR__OIDC_CLIENT_SECRET
      remoteRef:
        key: dashbrr-oidc
        property: client-secret
---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dashbrr-db
spec:
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: dashbrr-db
    template:
      data:
        DASHBRR__DB_DSN: postgres://dashbrr:{{ .DB_PASSWORD }}@pg18vc-rw.database.svc.cluster.local:5432/dashbrr?sslmode=disable
        DASHBRR__DB_TYPE: postgres
        # --
        INIT_POSTGRES_DBNAME: dashbrr
        INIT_POSTGRES_HOST: pg18vc-rw.database.svc.cluster.local
        INIT_POSTGRES_PASS: "{{ .DB_PASSWORD }}"
        INIT_POSTGRES_USER: dashbrr
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
      rewrite:
        - regexp:
            source: "password"
            target: "DB_PASSWORD"
---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dashbrr-initdb
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: dashbrr-initdb
  data:
    - secretKey: INIT_POSTGRES_SUPER_PASS
      remoteRef:
        key: cnpg-pg18vc
        property: password
