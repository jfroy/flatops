---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cleanrr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      cleanrr:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          cleanrr:
            image:
              repository: ghcr.io/zariel/cleanrr
              tag: v0.2.0@sha256:e38cdf1b22d071b3e71d85a6446042c46ddc4c1f6bc17b6603a4ba4ec9f3f73c
            env:
              CLEANRR_LISTEN_ADDR: 0.0.0.0:80
              CLEANRR_MINIMUM_AGE: 5m
              CLEANRR_POLL_INTERVAL: 2m
              CLEANRR_REMOVE_FROM_CLIENT: false
              CLEANRR_SERVERS__RADARR__URL: http://radarr.default.svc.cluster.local
              CLEANRR_SERVERS__SONARR__URL: http://sonarr.default.svc.cluster.local
              TZ: America/Los_Angeles
            envFrom:
              - secretRef:
                  name: cleanrr-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/live
                    port: &port 80
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/ready
                    port: *port
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/startup
                    port: *port
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
              readOnlyRootFilesystem: true
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
    service:
      cleanrr:
        controller: cleanrr
        ports:
          http:
            port: *port
    serviceMonitor:
      cleanrr:
        serviceName: cleanrr
        endpoints:
          - port: http
            scheme: http
            path: /metrics
