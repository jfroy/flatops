apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: weaver-egress
  annotations:
    future-me-why: VPN kill switch; Weaver tunnels Usenet traffic itself, so egress is limited to the WireGuard port, cluster DNS and Postgres
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: weaver
  egress:
    - toPorts:
        - ports:
            - port: "1637"
              protocol: UDP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: database
            cnpg.io/cluster: pg18vc
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  ingress:
    - toPorts:
        - ports:
            - port: "1637"
              protocol: UDP
