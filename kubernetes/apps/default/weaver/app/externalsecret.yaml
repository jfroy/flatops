---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: weaver
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: weaver-secret
  dataFrom:
    - extract:
        key: weaver
---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
