---
# yaml-language-server: $schema=https://crd.kantai.xyz/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: karakeep-chrome
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: karakeep
      app.kubernetes.io/controller: chrome
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: karakeep
            app.kubernetes.io/controller: karakeep
      toPorts:
        - ports:
            - port: "9222"
              protocol: TCP
