---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karakeep
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      chrome:
        containers:
          chrome:
            image:
              repository: ghcr.io/karakeep-app/karakeep-chrome
              tag: 156.0.8078.47-r1@sha256:4ad61127638dd27bfe685222787c5780dd1d083d23a7658c39af657775814c44
            args:
              - --disable-gpu
              - --disable-dev-shm-usage
              - --hide-scrollbars
              - --disable-blink-features=AutomationControlled
              - --window-size=1440,900
            env:
              TZ: America/Los_Angeles
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /json/version
                    port: &chromePort 9222
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
      karakeep:
        containers:
          karakeep:
            image:
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.34.1@sha256:69ae5315c618b7c14c1af3e34c6e211acdb231793af424ecd1cab0b70691d987
            env:
              BROWSER_CONNECT_ONDEMAND: true
              BROWSER_WEB_URL: http://karakeep-chrome.default.svc.cluster.local:9222
              COREPACK_INTEGRITY_KEYS: 0
              CRAWLER_DOWNLOAD_BANNER_IMAGE: true
              CRAWLER_BROWSER_TIMEZONE: America/Los_Angeles
              CRAWLER_ENABLE_ADBLOCKER: true
              CRAWLER_JOB_TIMEOUT_SEC: 120
              CRAWLER_NUM_WORKERS: 1
              CRAWLER_PREFLIGHT_USER_AGENT: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/156.0.0.0 Safari/537.36
              CRAWLER_SCREENSHOT_TIMEOUT_SEC: 30
              CRAWLER_STORE_SCREENSHOT: true
              DATA_DIR: /data
              DISABLE_NEW_RELEASE_CHECK: true
              DISABLE_PASSWORD_AUTH: true
              DISABLE_SIGNUPS: false
              INFERENCE_ENABLE_AUTO_SUMMARIZATION: true
              MEILI_ADDR: http://karakeep-meilisearch.default.svc.cluster.local:7700
              NEXTAUTH_URL: https://karakeep.kantai.xyz
              OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: true
              OAUTH_PROVIDER_NAME: Pocket ID
              OAUTH_WELLKNOWN_URL: https://pid.kantai.xyz/.well-known/openid-configuration
              OCR_USE_LLM: true
              PORT: &webPort 3000
              TZ: America/Los_Angeles
            envFrom:
              - secretRef:
                  name: karakeep
              - secretRef:
                  name: karakeep-meili
              - secretRef:
                  name: karakeep-nextauth
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *webPort
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
        pod:
          annotations:
            reloader.stakater.com/auto: "true"
      meilisearch:
        containers:
          meilisearch:
            image:
              repository: docker.io/getmeili/meilisearch
              tag: v1.56.0@sha256:1f578fa865f8251894b3bf38d6668d6209a3f451f8f65ab953e129d4c1db5ef4
            args:
              - /bin/meilisearch
              - --upgrade-db
            env:
              MEILI_ENV: production
              MEILI_NO_ANALYTICS: true
              TZ: America/Los_Angeles
            envFrom:
              - secretRef:
                  name: karakeep-meili
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 7700
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
        pod:
          annotations:
            reloader.stakater.com/auto: "true"
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      cache:
        accessMode: ReadWriteOnce
        size: 100Gi
        storageClass: ceph-block
        suffix: cache
        type: persistentVolumeClaim
        advancedMounts:
          karakeep:
            karakeep:
              - path: /app/apps/web/.next/cache
                subPath: web-cache
      data:
        existingClaim: "${APP}"
        advancedMounts:
          karakeep:
            karakeep:
              - path: /data
                subPath: karakeep
      meili:
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: ceph-block
        suffix: meili
        type: persistentVolumeClaim
        advancedMounts:
          meilisearch:
            meilisearch:
              - path: /meili_data
      run:
        type: emptyDir
        medium: Memory
        sizeLimit: 100Mi
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
    route:
      karakeep:
        hostnames:
          - "karakeep.kantai.xyz"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: karakeep
                port: *webPort
    service:
      karakeep:
        primary: true
        controller: karakeep
        ports:
          http:
            port: *webPort
      chrome:
        controller: chrome
        ports:
          http:
            port: *chromePort
      meilisearch:
        controller: meilisearch
        ports:
          http:
            port: 7700
