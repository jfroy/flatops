---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: holyarrs
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      holyarrs:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          holyarrs:
            image:
              repository: docker.io/holyarrs/holyarrs
              tag: 1.3.6@sha256:e6812da29eede1c95dd8d7ccfbdf6f98f8d9e1f69bf7c9f6285b0be1c1840d71
            env:
              HOLYARRS_ALLOWED_HOSTS: "holyarrs.kantai.xyz,holyarrs,holyarrs.default,holyarrs.default.svc,holyarrs.default.svc.cluster.local"
              HOLYARRS_MASTER_KEY_FILE: /run/secrets/holyarrs.key
              HOLYARRS_OIDC_CLIENT_ID: d27d585c-b21d-4533-9f45-358c52a8742f
              HOLYARRS_OIDC_CLIENT_SECRET_FILE: /run/secrets/holyarrs-oidc-client-secret
              HOLYARRS_OIDC_ENABLED: "true"
              HOLYARRS_OIDC_ISSUER: https://pid.kantai.xyz
              HOLYARRS_OIDC_REDIRECT_URL: https://${APP_SUBDOMAIN:-${APP}}.kantai.xyz/api/v1/auth/oidc/callback
              HOLYARRS_TRUSTED_PROXIES: 10.11.0.0/16
              HOLYARRS_UPDATE_CHECK: "off"
              TZ: America/Los_Angeles
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: &port 6262
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [4000]
    persistence:
      config:
        existingClaim: ${APP}
      secrets:
        type: secret
        name: holyarrs-secret
        defaultMode: 0440
        globalMounts:
          - path: /run/secrets/holyarrs.key
            subPath: HOLYARRS_MASTER_KEY
            readOnly: true
          - path: /run/secrets/holyarrs-oidc-client-secret
            subPath: HOLYARRS_OIDC_CLIENT_SECRET
            readOnly: true
      media2:
        type: persistentVolumeClaim
        existingClaim: media2
      tmp:
        type: emptyDir
    route:
      holyarrs:
        hostnames:
          - "${APP_SUBDOMAIN:-${APP}}.kantai.xyz"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - port: *port
                identifier: holyarrs
    service:
      holyarrs:
        controller: holyarrs
        ports:
          http:
            port: *port
