---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rqbit
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      rqbit:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          rqbit:
            image:
              repository: docker.io/ikatson/rqbit
              tag: 9.1.0@sha256:db3204d68b9a6327fc51f3bccb5048f04e4dcaf4f7737351e2a00ec997e46c17
            args: ["server", "start", "/media2/rqbit/downloads"]
            env:
              RQBIT_HTTP_API_LISTEN_ADDR: 0.0.0.0:3030
              RQBIT_LISTEN_PORT: &peerPort 31607
              RQBIT_LSD_DISABLE: "true"
              RQBIT_SESSION_PERSISTENCE_LOCATION: /config/session
              RQBIT_UPNP_PORT_FORWARD_DISABLE: "true"
              # The image's own CA bundle is under /etc, which the etc emptyDir below hides.
              SSL_CERT_FILE: /certs/ca-certificates.crt
              TZ: America/Los_Angeles
              XDG_CACHE_HOME: /config/cache
              XDG_DATA_HOME: /config/data
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 3030
              readiness: *probe
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
        initContainers:
          gluetun:
            image:
              repository: ghcr.io/jfroy/gluetun
              tag: v3.41.3@sha256:970fdef9eedb103e2f49a5c6716322d52053bc91fa67e6eebe32cfe43f315b50
            env:
              BLOCK_MALICIOUS: off # save 300MB of RAM; https://github.com/qdm12/gluetun/issues/2054
              DNS_CACHING: off
              DNS_SERVER: off
              DNS_UPSTREAM_IPV6: off
              DNS_UPSTREAM_PLAIN_ADDRESSES: 1.1.1.1:53,1.0.0.1:53
              DNS_UPSTREAM_RESOLVER_TYPE: plain
              FIREWALL_INPUT_PORTS: "3030,9999"
              FIREWALL_IPTABLES_LOG_LEVEL: debug
              FIREWALL_VPN_INPUT_PORTS: *peerPort
              HEALTH_RESTART_VPN: off
              HEALTH_SERVER_ADDRESS: ":9999"
              LOG_LEVEL: debug
              PUBLICIP_API: cloudflare
              STORAGE_SERVERS_DIRECTORY_PATH: /gluetun/servers/
              TZ: America/Los_Angeles
              VERSION_INFORMATION: off
              VPN_INTERFACE: wg0
              VPN_TYPE: wireguard
            envFrom:
              - secretRef:
                  name: gluetun-rqbit-secret
            # https://github.com/qdm12/gluetun-wiki/blob/main/setup/advanced/kubernetes.md#adding-ipv6-rule--file-exists
            lifecycle:
              postStart:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - (ip rule del table 51820; ip -6 rule del table 51820) || true
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  periodSeconds: 30
                  timeoutSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  initialDelaySeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 12
            resources:
              limits:
                kernel.org/tun: 1
            restartPolicy: Always
            securityContext:
              <<: *securityContext
              capabilities: { add: ["NET_ADMIN", "NET_RAW"] }
              readOnlyRootFilesystem: false
              runAsNonRoot: false
              runAsUser: 0
        pod:
          labels:
            pod-security.kantai.xyz/allow-added-capabilities: "true"
          hostname: rqbit
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: kantai1
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [4000]
    persistence:
      ca-certificates:
        type: configMap
        name: cluster-ca-certificates.crt
        advancedMounts:
          rqbit:
            rqbit:
              - path: /certs
                readOnly: true
      config:
        existingClaim: ${APP}
        advancedMounts:
          rqbit:
            rqbit:
              - path: /config
      # The image ships /etc as mode 0644, so a non-root user cannot read resolv.conf or hosts.
      etc:
        type: emptyDir
        advancedMounts:
          rqbit:
            rqbit:
              - path: /etc
      gluetun:
        existingClaim: gluetun-update
        advancedMounts:
          rqbit:
            gluetun:
              - path: /gluetun
                readOnly: true
      media2:
        type: persistentVolumeClaim
        existingClaim: media2
        advancedMounts:
          rqbit:
            rqbit:
              - path: /media2/rqbit
                subPath: rqbit
      run:
        type: emptyDir
        medium: Memory
        sizeLimit: 10Mi
        globalMounts:
          - path: /run
          - path: /var/run
      tmp:
        type: emptyDir
        advancedMounts:
          rqbit:
            rqbit:
              - path: /home/rqbit
                subPath: home
              - path: /tmp
                subPath: tmp
    route:
      rqbit:
        hostnames:
          - "${APP_SUBDOMAIN:-${APP}}.kantai.xyz"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - port: *port
                name: rqbit
    service:
      rqbit:
        controller: rqbit
        ports:
          http:
            port: *port
    serviceMonitor:
      rqbit:
        serviceName: rqbit
        endpoints:
          - port: http
            scheme: http
            path: /metrics
