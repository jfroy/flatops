---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: sonarr-secret
    template:
      data:
        SONARR__AUTH__APIKEY: "{{ .API_KEY }}"
        SONARR__POSTGRES__HOST: pg18vc-rw.database.svc.cluster.local
        SONARR__POSTGRES__MAINDB: sonarr-main
        SONARR__POSTGRES__PASSWORD: "{{ .POSTGRES_PASSWORD }}"
        SONARR__POSTGRES__PORT: "5432"
        SONARR__POSTGRES__USER: sonarr
  dataFrom:
    - extract:
        key: sonarr
