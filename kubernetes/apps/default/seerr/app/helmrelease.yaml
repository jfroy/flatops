---
# yaml-language-server: $schema=https://crd.kantai.xyz/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: seerr-chart
  values:
    fullnameOverride: seerr
    podAnnotations:
      reloader.stakater.com/auto: "true"
    securityContext:
      readOnlyRootFilesystem: true
    extraEnv:
      - name: TZ
        value: America/Los_Angeles
    extraEnvFrom:
      - secretRef:
          name: seerr
      - secretRef:
          name: seerr-pg
    config:
      persistence:
        existingClaim: seerr
    volumes:
      - name: logs
        emptyDir:
          sizeLimit: 256Mi
      - name: next-cache
        emptyDir:
          sizeLimit: 1Gi
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 128Mi
    volumeMounts:
      - name: logs
        mountPath: /app/config/logs
      - name: next-cache
        mountPath: /app/.next/cache
      - name: tmp
        mountPath: /tmp
    route:
      main:
        enabled: true
        parentRefs:
          - name: envoy-internal
            namespace: network
        hostnames:
          - seerr.kantai.xyz
