---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: paperless
    template:
      data:
        PAPERLESS_ADMIN_USER: "{{ .PAPERLESS_ADMIN_USER }}"
        PAPERLESS_ADMIN_PASSWORD: "{{ .PAPERLESS_ADMIN_PASSWORD }}"
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: |-
          {
            "openid_connect": {
              "APPS": [
                {
                  "provider_id": "pocket-id",
                  "name": "Pocket ID",
                  "client_id": "{{ .PAPERLESS_OIDC_CLIENT_ID }}",
                  "secret": "{{ .PAPERLESS_OIDC_CLIENT_SECRET }}",
                  "settings": {
                    "fetch_userinfo": true,
                    "oauth_pkce_enabled": true,
                    "server_url": "https://pid.kantai.xyz/.well-known/openid-configuration",
                    "token_auth_method": "client_secret_post"
                  }
                }
              ],
              "SCOPE": [
                "openid",
                "profile",
                "email"
              ]
            }
          }
  dataFrom:
    - extract:
        key: paperless
---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-secret-key
spec:
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: paperless-secret-key
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
      rewrite:
        - regexp:
            source: "password"
            target: "PAPERLESS_SECRET_KEY"
