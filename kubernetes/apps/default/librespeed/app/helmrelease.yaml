---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: librespeed
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      librespeed:
        containers:
          librespeed:
            image:
              repository: ghcr.io/librespeed/speedtest
              tag: 6.3.1@sha256:bc34bf69b6c102b23ab81b6e77beb7cce321fb0d3be33ec6e80edef3e9dd8bab
            env:
              MODE: standalone
              TELEMETRY: "false"
              TZ: America/Los_Angeles
              WEBPORT: &port 8080
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
              readiness: *probe
            # The entrypoint runs as root to copy and chown the webroot, then Apache drops to www-data.
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "SETGID", "SETUID"]
    route:
      librespeed:
        hostnames:
          - "${APP_SUBDOMAIN:-${APP}}.kantai.xyz"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - port: *port
                identifier: librespeed
    service:
      librespeed:
        controller: librespeed
        ports:
          http:
            port: *port
