---
# yaml-language-server: $schema=https://crd.kantai.xyz/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app openspeedtest
spec:
  path: ./kubernetes/apps/default/openspeedtest/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: default-openspeedtest
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      APP_SUBDOMAIN: speedtest
