server {
    server_name _;
    listen 3000 reuseport;
    root /usr/share/nginx/html/;
    index index.html;
    client_max_body_size 35m;
    error_page 405 =200 $uri;
    access_log off;
    error_log /dev/stderr warn;
    log_not_found off;
    server_tokens off;
    gzip off;
    tcp_nodelay on;
    tcp_nopush on;
    sendfile on;
    open_file_cache max=200000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    location / {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Headers "Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Mx-ReqToken,X-Requested-With" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Cache-Control "no-store, no-cache, max-age=0, no-transform";
        add_header Last-Modified $date_gmt;
        if_modified_since off;
        expires off;
        etag off;

        if ($request_method = OPTIONS) {
            return 200;
        }
    }

    # Envoy speaks HTTP/2 to clients, so nginx must read the whole upload body
    # before answering or upload speeds read high; buffer it in memory.
    location = /upload {
        client_body_buffer_size 35m;
        proxy_pass http://127.0.0.1:3000/dev-null;
    }

    location = /dev-null {
        return 200;
    }

    location ~* ^.+\.(?:css|cur|js|jpe?g|gif|htc|ico|png|html|xml|otf|ttf|eot|woff|woff2|svg)$ {
        expires 365d;
        add_header Cache-Control public;
        add_header Vary Accept-Encoding;
        tcp_nodelay off;
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript image/svg+xml;
    }
}
