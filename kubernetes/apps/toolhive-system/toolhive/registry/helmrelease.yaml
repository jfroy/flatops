---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: toolhive-registry-server
spec:
  chartRef:
    kind: OCIRepository
    name: toolhive-registry-server
  interval: 1h
  values:
    podAnnotations:
      reloader.stakater.com/auto: "true"
    podSecurityContext:
      fsGroup: 65535
    extraEnv:
      - name: PGSSLCERT
        value: /etc/postgresql/client/tls.crt
      - name: PGSSLKEY
        value: /etc/postgresql/client/tls.key
      - name: PGSSLROOTCERT
        value: /certs/ca-certificates.crt
    extraVolumes:
      - name: pg-client
        secret:
          secretName: toolhive-registry-pg
          defaultMode: 0440
      - name: cluster-ca
        configMap:
          name: cluster-ca-certificates.crt
    extraVolumeMounts:
      - name: pg-client
        mountPath: /etc/postgresql/client
        readOnly: true
      - name: cluster-ca
        mountPath: /certs
        readOnly: true
    config:
      sources:
        - name: toolhive
          git:
            repository: https://github.com/stacklok/toolhive-catalog.git
            branch: main
            path: pkg/catalog/toolhive/data/registry-upstream.json
          syncPolicy:
            interval: 30m
        # Discover MCPServer CRs running in-cluster (e.g. ha-mcp) via the
        # operator. RBAC is cluster-scoped, so it can watch the mcp namespace.
        - name: cluster
          kubernetes:
            namespaces: ["mcp"]
          syncPolicy:
            interval: 5m
      registries:
        - name: default
          sources: ["toolhive", "cluster"]
      auth:
        mode: anonymous
      database:
        host: pg18vc-rw.database.svc.cluster.local
        port: 5432
        user: toolhive_registry
        database: toolhive_registry
        # toolhive-core bootstraps TLS from postgres://localhost, so verify-full checks the wrong hostname.
        sslMode: verify-ca
        maxOpenConns: 10
        maxIdleConns: 5
        connMaxLifetime: 30m
