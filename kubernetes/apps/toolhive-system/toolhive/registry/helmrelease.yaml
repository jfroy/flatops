---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: toolhive-registry-server
spec:
  chartRef:
    kind: OCIRepository
    name: toolhive-registry-server
  interval: 1h
  values:
    podAnnotations:
      reloader.stakater.com/auto: "true"
    extraEnv:
      - name: THV_REGISTRY_DATABASE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: toolhive-registry-pg
            key: THV_REGISTRY_DATABASE_PASSWORD
      - name: PGSSLROOTCERT
        value: /certs/ca-certificates.crt
    extraVolumes:
      - name: cluster-ca
        configMap:
          name: cluster-ca-certificates.crt
    extraVolumeMounts:
      - name: cluster-ca
        mountPath: /certs
        readOnly: true
    config:
      sources:
        - name: toolhive
          git:
            repository: https://github.com/stacklok/toolhive-catalog.git
            branch: main
            path: pkg/catalog/toolhive/data/registry-upstream.json
          syncPolicy:
            interval: 30m
        # Discover MCPServer CRs running in-cluster (e.g. ha-mcp) via the
        # operator. RBAC is cluster-scoped, so it can watch the mcp namespace.
        - name: cluster
          kubernetes:
            namespaces: ["mcp"]
          syncPolicy:
            interval: 5m
      registries:
        - name: default
          sources: ["toolhive", "cluster"]
      auth:
        mode: anonymous
      database:
        host: pg18vc-rw.database.svc.cluster.local
        port: 5432
        user: toolhive_registry
        database: toolhive_registry
        sslMode: verify-ca
        maxOpenConns: 10
        maxIdleConns: 5
        connMaxLifetime: 30m
