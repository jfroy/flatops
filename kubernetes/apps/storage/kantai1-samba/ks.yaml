---
# yaml-language-server: $schema=https://crd.kantai.xyz/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kantai1-samba
spec:
  dependsOn:
    - name: storage-pv
  path: ./kubernetes/apps/storage/kantai1-samba/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: storage-kantai1-samba
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
