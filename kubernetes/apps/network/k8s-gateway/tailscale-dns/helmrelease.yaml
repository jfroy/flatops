---
# yaml-language-server: $schema=https://crd.kantai.xyz/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-dns
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  values:
    domain: kantai.xyz
    ttl: 1
    service:
      ipFamily: IPv4
      ipFamilyPolicy: SingleStack
      loadBalancerClass: tailscale
      port: 53
      type: LoadBalancer
    watchedResources: ["GRPCRoute", "HTTPRoute"]
    zoneFiles:
      - filename: etincelle.cloud.db
        domains: etincelle.cloud
        fallthrough:
          enabled: true
        contents: |
          $ORIGIN etincelle.cloud.
          $TTL 60
          @         IN SOA  ns hostmaster 1 7200 3600 1209600 60
          @         IN NS   ns
          bao       IN A    100.65.186.72
          bao       IN AAAA fd7a:115c:a1e0::913a:ba4a
          ds        IN A    100.65.186.72
          ds        IN AAAA fd7a:115c:a1e0::913a:ba4a
          registry  IN A    100.65.186.72
          registry  IN AAAA fd7a:115c:a1e0::913a:ba4a
          static    IN A    100.65.186.72
          static    IN AAAA fd7a:115c:a1e0::913a:ba4a
          tif       IN A    100.65.186.72
          tif       IN AAAA fd7a:115c:a1e0::913a:ba4a
