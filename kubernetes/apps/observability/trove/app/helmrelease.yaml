---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trove
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      server:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          server:
            image:
              repository: ghcr.io/techdox/trove-server
              tag: 0.18.1@sha256:9e781f474d2a1c75a468aa960df5f918033fc1bdc3356e928b1f3d2b2cfd7c31
            env:
              TROVE_BOOTSTRAP_AGENT: kubernetes
              TROVE_OIDC_CLIENT_ID: cf3a4457-dbe5-411c-8bbb-9ae6795c4f95
              TROVE_OIDC_ISSUER: https://pid.kantai.xyz
              TROVE_OIDC_REDIRECT_URL: https://trove.kantai.xyz/oauth2/callback
              SQLITE_TMPDIR: /tmp
              TZ: America/Los_Angeles
            envFrom:
              - secretRef:
                  name: trove
              - secretRef:
                  name: trove-token
              - secretRef:
                  name: trove-api-token
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
        serviceAccount:
          identifier: server
      agent-k8s:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          agent-k8s:
            image:
              repository: ghcr.io/techdox/trove-agent-k8s
              tag: 0.18.1@sha256:56d2fb30d3b1e705fe286d5bd9a37e50095de6fee46667e464102eee40c56e06
            env:
              TROVE_CLUSTER_NAME: kantai
              TROVE_SERVER_URL: http://trove.observability.svc.cluster.local:8080
            envFrom:
              - secretRef:
                  name: trove-token
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
        pod:
          automountServiceAccountToken: true
        serviceAccount:
          identifier: trove-agent-k8s
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    serviceAccount:
      server:
        forceRename: trove-server
      trove-agent-k8s:
        forceRename: trove-agent-k8s
    persistence:
      data:
        existingClaim: "${APP}"
        advancedMounts:
          server:
            server:
              - path: /data
      tmp:
        type: emptyDir
        advancedMounts:
          server:
            server:
              - path: /tmp
    route:
      trove:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 401"]
        hostnames:
          - trove.kantai.xyz
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: server
                port: *port
    service:
      server:
        primary: true
        controller: server
        ports:
          http:
            port: *port
    serviceMonitor:
      server:
        service:
          identifier: server
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            authorization:
              type: Bearer
              credentials:
                name: trove-api-token
                key: TROVE_API_TOKEN
            metricRelabelings:
              - action: labeldrop
                regex: (pod)
