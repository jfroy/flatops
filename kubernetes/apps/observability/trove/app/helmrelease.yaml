---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trove
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      server:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          server:
            image:
              repository: ghcr.io/techdox/trove-server
              tag: 0.17.0@sha256:998237dd24eaa68709a90b24881c4bce01f91e74d7ba74947b64464e1e0fcb79
            env:
              TROVE_BOOTSTRAP_AGENT: kubernetes
              TROVE_OIDC_CLIENT_ID: cf3a4457-dbe5-411c-8bbb-9ae6795c4f95
              TROVE_OIDC_ISSUER: https://pid.kantai.xyz
              TROVE_OIDC_REDIRECT_URL: https://trove.kantai.xyz/oauth2/callback
              TZ: America/Los_Angeles
            envFrom:
              - secretRef:
                  name: trove
              - secretRef:
                  name: trove-token
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
        serviceAccount:
          identifier: server
      agent-k8s:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          agent-k8s:
            image:
              repository: ghcr.io/techdox/trove-agent-k8s
              tag: 0.17.0@sha256:2409599cd585532661f0f23a4b5e4be03797b5e49e85ec4c041a63896b5ca898
            env:
              TROVE_CLUSTER_NAME: kantai
              TROVE_SERVER_URL: http://trove.observability.svc.cluster.local:8080
            envFrom:
              - secretRef:
                  name: trove-token
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
        serviceAccount:
          identifier: trove-agent-k8s
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    serviceAccount:
      server:
        forceRename: trove-server
      trove-agent-k8s:
        forceRename: trove-agent-k8s
    persistence:
      data:
        existingClaim: "${APP}"
        advancedMounts:
          server:
            server:
              - path: /data
    route:
      trove:
        hostnames:
          - trove.kantai.xyz
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: server
                port: *port
    service:
      server:
        primary: true
        controller: server
        ports:
          http:
            port: *port
