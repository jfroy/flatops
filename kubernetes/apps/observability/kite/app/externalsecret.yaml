---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kite
spec:
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: kite
    template:
      data:
        JWT_SECRET: "{{ .JWT_SECRET }}"
        KITE_ENCRYPT_KEY: "{{ .KITE_ENCRYPT_KEY }}"
  dataFrom:
    - extract:
        key: kite
---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kite-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: kite-oidc
  dataFrom:
    - extract:
        key: kite-oidc
