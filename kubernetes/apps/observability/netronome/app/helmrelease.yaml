---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netronome
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      netronome:
        initContainers:
          download-geoip:
            image:
              repository: quay.io/curl/curl
              tag: "8.22.0"
            command: ["/download-geoip.sh"]
            envFrom:
              - secretRef:
                  name: netronome-maxmind
        containers:
          netronome:
            image:
              repository: ghcr.io/autobrr/netronome
              tag: v0.15.0@sha256:50039e4cfadc4fc0d60147f369ebf4ca077cf107dce18c07e38baf80005b9660
            env:
              NETRONOME__DB_HOST: pg18vc-rw.database.svc.cluster.local
              NETRONOME__DB_NAME: netronome
              # Never sent under cert auth; netronome's keyword DSN breaks on an empty password.
              NETRONOME__DB_PASSWORD: unused
              NETRONOME__DB_PORT: "5432"
              NETRONOME__DB_SSLMODE: verify-full
              NETRONOME__DB_TYPE: postgres
              NETRONOME__DB_USER: netronome
              NETRONOME__HOST: 0.0.0.0
              NETRONOME__PORT: &port 7575
              PGSSLCERT: /etc/postgresql/client/tls.crt
              PGSSLKEY: /etc/postgresql/client/tls.key
              PGSSLROOTCERT: /etc/postgresql/ca/ca.crt
              TZ: America/Los_Angeles
            envFrom:
              - secretRef:
                  name: netronome-oidc
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    configMaps:
      dockerenv:
        suffix: dockerenv
        data:
          dockerenv: ""
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      data:
        existingClaim: "${APP}"
      dockerenv:
        type: configMap
        identifier: dockerenv
        globalMounts:
          - path: /.dockerenv
            subPath: dockerenv
      download-geoip:
        type: configMap
        name: netronome-download-geoip
        defaultMode: 0755
        globalMounts:
          - path: /download-geoip.sh
            subPath: download-geoip.sh
            readOnly: true
      geoip:
        type: persistentVolumeClaim
        forceRename: netronome-geoip
        storageClass: openebs-hostpath
        accessMode: ReadWriteOnce
        size: 100Gi
      pg-ca:
        type: configMap
        name: cluster-ca.crt
        advancedMounts:
          netronome:
            netronome:
              - path: /etc/postgresql/ca
                readOnly: true
      pg-client:
        type: secret
        name: netronome-pg
        defaultMode: 0440
        advancedMounts:
          netronome:
            netronome:
              - path: /etc/postgresql/client
                readOnly: true
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
    route:
      netronome:
        hostnames:
          - "${APP_SUBDOMAIN:-${APP}}.kantai.xyz"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: netronome
                port: *port
    service:
      netronome:
        controller: netronome
        type: ClusterIP
        ports:
          http:
            port: *port
