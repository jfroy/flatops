# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netronome-maxmind
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: netronome-maxmind
    template:
      type: kubernetes.io/basic-auth
  dataFrom:
    - extract:
        key: maxmind
---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netronome-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: netronome-oidc
  dataFrom:
    - extract:
        key: netronome-oidc
