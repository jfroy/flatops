---
# yaml-language-server: $schema=https://crd.kantai.xyz/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gatus-sidecar-rules
spec:
  groups:
    - name: gatus.rules
      rules:
        - alert: GatusEndpointDown
          expr: |-
            gatus_results_endpoint_success{group=~"external|internal|services"} == 0
          for: 5m
          annotations:
            summary: >-
              The {{ $labels.group }}/{{ $labels.name }} endpoint is down
          labels:
            severity: critical
