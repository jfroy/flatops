---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  # renovate: datasource=docker depName=ghcr.io/berriai/litellm versioning=loose
  image: ghcr.io/berriai/litellm:v1.100.0-rc.1@sha256:846795f2a2b5787ce2155170fd33b9ae886fd925f26635424ee613d53ece2fa4
  replicas: 1
  applyMode: api
  podAnnotations:
    reloader.stakater.com/auto: "true"
  apiAccess:
    masterKeyRef:
      name: litellm-keys
      key: PROXY_MASTER_KEY
  route:
    hostnames:
      - litellm.kantai.xyz
    parentRefs:
      - name: envoy-internal
        namespace: network
  # The proxy takes ~45s (prisma migrate, then model registration). The CRD
  # exposes no startupProbe.
  livenessProbe:
    httpGet:
      path: /health/liveliness
      port: 4000
    initialDelaySeconds: 120
    timeoutSeconds: 5
  callbacks:
    callbacks: ["prometheus", "s3_v2"]
  generalSettings:
    master_key: os.environ/PROXY_MASTER_KEY
    database_connection_pool_limit: 10
    proxy_batch_write_at: 60
  litellmSettings:
    s3_callback_params:
      s3_bucket_name: os.environ/S3_BUCKET_NAME
      s3_region_name: os.environ/S3_REGION_NAME
      s3_endpoint_url: os.environ/S3_ENDPOINT_URL
      s3_use_virtual_hosted_style: true
    request_timeout: 600
    set_verbose: false
    json_logs: true
  env:
    - name: LITELLM_LOG
      value: ERROR
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: TZ
      value: America/Los_Angeles
    - name: S3_BUCKET_NAME
      value: litellm-s3
    - name: S3_REGION_NAME
      value: us-west-1
    - name: S3_ENDPOINT_URL
      value: https://s3.kantai.xyz
    - name: PROXY_BASE_URL
      value: https://litellm.kantai.xyz
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: https://pid.kantai.xyz/authorize
    - name: GENERIC_CLIENT_ID
      value: a0b9bcc2-6e1d-4a6f-99fc-b431666aac89
    - name: GENERIC_TOKEN_ENDPOINT
      value: https://pid.kantai.xyz/api/oidc/token
    - name: GENERIC_USERINFO_ENDPOINT
      value: https://pid.kantai.xyz/api/oidc/userinfo
    - name: GENERIC_SCOPE
      value: "openid profile email"
    - name: GENERIC_USER_ID_ATTRIBUTE
      value: sub
    - name: GENERIC_USER_ROLE_ATTRIBUTE
      value: litellm_role
    - name: GENERIC_INCLUDE_TOKEN_CLAIMS
      value: "true"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: litellm-db
          key: DATABASE_URL
    - name: DATABASE_URL_READ_REPLICA
      valueFrom:
        secretKeyRef:
          name: litellm-db
          key: DATABASE_URL_READ_REPLICA
  envFrom:
    - secretRef:
        name: litellm
    - secretRef:
        name: litellm-keys
    - secretRef:
        name: litellm-salt
    - secretRef:
        name: litellm-s3-obc
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 500Mi
    - name: cache
      emptyDir:
        sizeLimit: 500Mi
    - name: npm
      emptyDir:
        sizeLimit: 500Mi
  volumeMounts:
    - name: tmp
      mountPath: /tmp
    - name: cache
      mountPath: /.cache
    - name: npm
      mountPath: /.npm
