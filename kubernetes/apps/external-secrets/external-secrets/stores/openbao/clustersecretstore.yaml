---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: https://bao.etincelle.cloud
      path: kantai
      version: v2
      auth:
        # OpenBao validates the projected token against a static copy of this
        # cluster's service-account JWKS (etincelle: scripts/openbao-init.sh),
        # so there is no bootstrap secret in the cluster and no callback from
        # OpenBao to the API server. Re-run openbao-init with a fresh
        # `kubectl get --raw /openid/v1/jwks` if the SA signing key changes.
        jwt:
          path: jwt
          role: kantai-eso
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: external-secrets
            audiences: ["openbao"]
            expirationSeconds: 600
