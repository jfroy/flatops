---
# yaml-language-server: $schema=https://crd.kantai.xyz/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plane
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: plane
  driftDetection:
    mode: enabled
    ignore:
      # Chart stamps `timestamp: now` on every pod template each render; ignore it so
      # drift correction does not roll all pods every reconcile.
      - paths: ["/spec/template/metadata/annotations/timestamp"]
  values:
    # renovate: datasource=github-releases depName=makeplane/plane
    planeVersion: v1.4.2
    web:
      image: docker.io/makeplane/plane-frontend
    space:
      image: docker.io/makeplane/plane-space
    admin:
      image: docker.io/makeplane/plane-admin
    live:
      image: docker.io/makeplane/plane-live
    api:
      image: docker.io/makeplane/plane-backend
    worker:
      image: docker.io/makeplane/plane-backend
      memoryLimit: 2000Mi
    beatworker:
      image: docker.io/makeplane/plane-backend
      memoryLimit: 1500Mi
    ingress:
      enabled: false
      # Ingress disabled (we use HTTPRoute), but appHost still drives WEB_URL / CORS env.
      appHost: plane.kantai.xyz
    postgres:
      local_setup: false
    redis:
      local_setup: true
      storageClass: ceph-block
      volumeSize: 100Mi
    rabbitmq:
      local_setup: true
      storageClass: ceph-block
      volumeSize: 100Mi
      default_user: plane
    minio:
      local_setup: false
    env:
      default_cluster_domain: cluster.local
      docstore_bucket: plane
      aws_region: us-west-1
      aws_s3_endpoint_url: https://s3.kantai.xyz
      pgdb_remote_url: "postgresql://plane@pg18vc-rw.database.svc.cluster.local:5432/plane?sslmode=verify-full&sslrootcert=/etc/postgresql/ca/ca.crt&sslcert=/etc/postgresql/client/tls.crt&sslkey=/etc/postgresql/client/tls.key"
  valuesFrom:
    - kind: Secret
      name: plane
      valuesKey: SECRET_KEY
      targetPath: env.secret_key
    - kind: Secret
      name: plane
      valuesKey: LIVE_SERVER_SECRET_KEY
      targetPath: env.live_server_secret_key
    - kind: Secret
      name: plane
      valuesKey: RABBITMQ_DEFAULT_PASS
      targetPath: rabbitmq.default_password
    - kind: Secret
      name: plane-obc
      valuesKey: AWS_ACCESS_KEY_ID
      targetPath: env.aws_access_key
    - kind: Secret
      name: plane-obc
      valuesKey: AWS_SECRET_ACCESS_KEY
      targetPath: env.aws_secret_access_key
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: plane-api-wl
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: plane-api-wl
              spec:
                template:
                  spec:
                    containers:
                      - name: plane-api
                        volumeMounts:
                          - name: pg-ca
                            mountPath: /etc/postgresql/ca
                            readOnly: true
                          - name: pg-client
                            mountPath: /etc/postgresql/client
                            readOnly: true
                    volumes:
                      - name: pg-ca
                        configMap:
                          name: cluster-ca.crt
                      - name: pg-client
                        secret:
                          secretName: plane-pg
                          defaultMode: 0440
          - target:
              kind: Deployment
              name: plane-worker-wl
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: plane-worker-wl
              spec:
                template:
                  spec:
                    containers:
                      - name: plane-worker
                        volumeMounts:
                          - name: pg-ca
                            mountPath: /etc/postgresql/ca
                            readOnly: true
                          - name: pg-client
                            mountPath: /etc/postgresql/client
                            readOnly: true
                    volumes:
                      - name: pg-ca
                        configMap:
                          name: cluster-ca.crt
                      - name: pg-client
                        secret:
                          secretName: plane-pg
                          defaultMode: 0440
          - target:
              kind: Deployment
              name: plane-beat-worker-wl
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: plane-beat-worker-wl
              spec:
                template:
                  spec:
                    containers:
                      - name: plane-beat-worker
                        volumeMounts:
                          - name: pg-ca
                            mountPath: /etc/postgresql/ca
                            readOnly: true
                          - name: pg-client
                            mountPath: /etc/postgresql/client
                            readOnly: true
                    volumes:
                      - name: pg-ca
                        configMap:
                          name: cluster-ca.crt
                      - name: pg-client
                        secret:
                          secretName: plane-pg
                          defaultMode: 0440
          - target:
              kind: Job
              name: plane-api-migrate-.*
            patch: |
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: plane-api-migrate
              spec:
                template:
                  spec:
                    containers:
                      - name: plane-api-migrate
                        volumeMounts:
                          - name: pg-ca
                            mountPath: /etc/postgresql/ca
                            readOnly: true
                          - name: pg-client
                            mountPath: /etc/postgresql/client
                            readOnly: true
                    volumes:
                      - name: pg-ca
                        configMap:
                          name: cluster-ca.crt
                      - name: pg-client
                        secret:
                          secretName: plane-pg
                          defaultMode: 0440
          # Chart hardcodes WEB_URL to http://; TLS terminates at the gateway.
          - target:
              kind: ConfigMap
              name: plane-app-vars
            patch: |
              - op: replace
                path: /data/WEB_URL
                value: https://plane.kantai.xyz
          # Entrypoint runs `celery worker` with no --concurrency, so the prefork pool
          # sizes to the node's core count and OOMs on a many-core node. Cap it.
          - target:
              kind: Deployment
              name: plane-worker-wl
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/command
                value:
                  - /bin/bash
                  - -c
                  - python manage.py wait_for_db && python manage.py wait_for_migrations && celery -A plane worker -l info --concurrency=4
