---
# yaml-language-server: $schema=https://crd.kantai.xyz/operator.victoriametrics.com/vmrule_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: kopiur-cache
spec:
  groups:
    - name: kopiur-cache
      rules:
        - alert: KopiurCacheVolumeFillingUp
          expr: |
            100 * (
              1 - min_over_time(
                    kubelet_volume_stats_available_bytes{persistentvolumeclaim=~"kopiur-cache-.*"}[48h]
                  )
                  / max_over_time(
                    kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~"kopiur-cache-.*"}[48h]
                  )
            ) > 80
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "kopiur cache volume {{ $labels.persistentvolumeclaim }} peaked at {{ $value | printf \"%.1f\" }}% full"
            description: >-
              Cache PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} peaked at
              {{ $value | printf "%.1f" }}% used over the last 48h, above the 80% threshold.

        - alert: KopiurCacheVolumeFull
          expr: |
            100 * (
              1 - min_over_time(
                    kubelet_volume_stats_available_bytes{persistentvolumeclaim=~"kopiur-cache-.*"}[48h]
                  )
                  / max_over_time(
                    kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~"kopiur-cache-.*"}[48h]
                  )
            ) > 92
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "kopiur cache volume {{ $labels.persistentvolumeclaim }} is {{ $value | printf \"%.1f\" }}% full"
            description: >-
              Cache PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} peaked at
              {{ $value | printf "%.1f" }}% used over the last 48h, above the 92% threshold.

    - name: kopiur-maintenance
      rules:
        - alert: KopiurQuickMaintenanceStale
          expr: |
            max(
              max_over_time(
                kube_job_status_succeeded{namespace="kopiur-system", job_name=~"kopiur-r2-q-.*"}[20h]
              )
            ) < 1
            or
            absent_over_time(
              kube_job_status_succeeded{namespace="kopiur-system", job_name=~"kopiur-r2-q-.*"}[20h]
            )
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "kopiur quick maintenance has not succeeded in 20h"
            description: >-
              No kopiur-r2 quick-maintenance Job in namespace kopiur-system has succeeded in the
              last 20h. The configured schedule is every 6h.

        - alert: KopiurFullMaintenanceStale
          expr: |
            max(
              max_over_time(
                kube_job_status_succeeded{namespace="kopiur-system", job_name=~"kopiur-r2-f-.*"}[50h]
              )
            ) < 1
            or
            absent_over_time(
              kube_job_status_succeeded{namespace="kopiur-system", job_name=~"kopiur-r2-f-.*"}[50h]
            )
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "kopiur full maintenance has not succeeded in 50h"
            description: >-
              No kopiur-r2 full-maintenance Job in namespace kopiur-system has succeeded in the
              last 50h. The configured schedule is daily.
