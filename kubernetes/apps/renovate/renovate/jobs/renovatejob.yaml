---
# yaml-language-server: $schema=https://crd.kantai.xyz/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: github-jfroy-bot
spec:
  provider:
    name: github
  discoveryFilters:
  - jfroy/*
  skipForks: true
  githubAppReference:
    secretName: github-jfroy-bot-app
    appIdSecretKey: APP_ID
    installationIdSecretKey: INSTALL_ID
    pemSecretKey: PEM
  # renovate: datasource=docker depName=ghcr.io/jfroy/renovate
  image: ghcr.io/jfroy/renovate:44.124.2@sha256:7aa4d9002ed9a3e9c8b3e99763d4aefdfa3d8e6ab9044f61643dd1573441a1f3
  schedule: 0,30 * * * *
  parallelism: 10
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1Gi
  runtimeClassName: kata
  webhook:
    enabled: true
    authentication:
      enabled: true
      secretRef:
        name: webhook-token
        key: token
    sync:
      enabled: true
  renovateConfig:
    inline: |
      module.exports = {
        allowedCommands: ['^helm-docs( .*)?$', '^helm-schema( .*)?$'],
        allowedUnsafeExecutions: ['mise'],
        platformCommit: 'enabled',
        internalHostAccess: 'block',
        hostRules: [
          {
            hostType: 'docker',
            matchHost: 'docker.io',
            username: process.env.DOCKERHUB_USERNAME,
            password: process.env.DOCKERHUB_TOKEN,
          },
          { matchHost: 'kantai.xyz' },
          { matchHost: 'etincelle.cloud' },
        ],
      };
  extraEnv:
    - name: LOG_LEVEL
      value: debug
    - name: DOCKERHUB_USERNAME
      valueFrom:
        secretKeyRef:
          name: docker-hub-token
          key: DOCKERHUB_USERNAME
    - name: DOCKERHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: docker-hub-token
          key: DOCKERHUB_TOKEN
