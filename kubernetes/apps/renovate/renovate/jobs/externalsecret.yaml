---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name github-jfroy-bot-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      metadata:
        labels:
          # Opts the secret in to being read by the operator on behalf of the
          # RenovateJob (policy.requireSecretRefOptIn).
          renovate-operator.mogenius.com/allow-ref: "true"
      data:
        APP_ID: Iv23li6vvjqdgaiJgDNU
        INSTALL_ID: "50278892"
        PEM: "{{ .PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: github-jfroy-bot
---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name docker-hub-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        DOCKERHUB_USERNAME: jfroy
        DOCKERHUB_TOKEN: "{{ .credential }}"
  dataFrom:
    - extract:
        key: dockerhub-renovate
---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name webhook-token
spec:
  refreshPolicy: Periodic
  refreshInterval: 8760h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      metadata:
        labels:
          # Read by the webhook server on every delivery
          # (policy.requireSecretRefOptIn).
          renovate-operator.mogenius.com/allow-ref: "true"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: password32
      rewrite:
        - regexp:
            source: "password"
            target: "token"
