---
# yaml-language-server: $schema=https://crd.kantai.xyz/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: node-feature-discovery
  values:
    worker:
      tolerations:
        - key: node.kantai.xyz/low-memory
          operator: Exists
          effect: NoSchedule
    topologyUpdater:
      enable: false
      createCRDs: true
    prometheus:
      enable: true
