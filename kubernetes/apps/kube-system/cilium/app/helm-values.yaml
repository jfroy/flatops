---
autoDirectNodeRoutes: true
bandwidthManager:
  enabled: true
  bbr: true
bgpControlPlane:
  enabled: true
bpf:
  # Explicit map maxima take precedence over dynamic sizing (agent only computes
  # a size when the option is unset). Pinned so every node gets identical maps
  # regardless of RAM: without this, kantai1's 251GiB inflated preallocated BPF
  # maps to ~2.9GiB of agent RSS while kantai2 (7.7GiB) sat at the floor anyway.
  # ctAnyMax is twice upstream's floor: at 65536, ct_any4_global ran at ~60% on
  # kantai1 and peaked at 96% (kantai3: 91%).
  ctAnyMax: 131072
  ctTcpMax: 131072 # LimitTableAutoGlobalTCPMin
  datapathMode: veth
  # Only still governs the sock-rev-nat map, which has no dedicated helm value.
  mapDynamicSizeRatio: 0.0005
  masquerade: true # See https://github.com/siderolabs/talos/issues/8836 (forwardKubeDNSToHost)
  natMax: 131072 # LimitTableAutoNatGlobalMin
  neighMax: 131072
  preallocateMaps: true
  # Only redirects traffic into the L7 proxy, which l7Proxy=false disables. Also
  # the sole blocker for bpf.datapathMode=netkit, which 1.20 rejects at render
  # time when tproxy is on (cilium#39892).
  tproxy: false
cgroup:
  automount:
    enabled: false
  hostRoot: /sys/fs/cgroup
cluster:
  id: 1
  name: kantai
cni:
  exclusive: false
defaultLBServiceIPAM: none
enableIPv4BIGTCP: true
enableIPv6BIGTCP: true
# Pod, service, and load-balancer IPs are allocated from a publicly routable CIDR.
enableIPv6Masquerade: false
endpointRoutes:
  enabled: true
envoy:
  enabled: false
ipam:
  mode: kubernetes
ipv4:
  enabled: true
ipv4NativeRoutingCIDR: 10.11.0.0/16
ipv6:
  enabled: true
k8sServiceHost: 127.0.0.1
k8sServicePort: 7445
kubeProxyReplacement: true
kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
l7Proxy: false
loadBalancer:
  acceleration: disabled
  algorithm: maglev
  mode: dsr
operator:
  replicas: 2
  rollOutPods: true
  resources:
    requests:
      cpu: 25m
pmtuDiscovery:
  enabled: true
policyDenyResponse: icmp
resources:
  requests:
    cpu: 100m
rollOutCiliumPods: true
routingMode: native
securityContext:
  capabilities:
    ciliumAgent:
      - BPF
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - IPC_LOCK
      - KILL
      - NET_ADMIN
      - NET_RAW
      - PERFMON
      - SETGID
      - SETUID
      - SYS_ADMIN
      - SYS_RESOURCE
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
socketLB:
  enabled: true
  hostNamespaceOnly: true
  terminatePodConnections: true
