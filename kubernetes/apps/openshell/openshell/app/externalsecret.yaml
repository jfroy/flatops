# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openshell-cek
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: openshell-cek
    template:
      data:
        key-encryption-key: "{{ .KEK_RAW | b64enc }}"
  dataFrom:
    - extract:
        key: openshell-cek
