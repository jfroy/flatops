---
# yaml-language-server: $schema=https://crd.kantai.xyz/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: tuppr
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    notification:
      enabled: true
      secretName: tuppr-notification
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
        additionalRuleLabels:
          notify: tuppr-pushover
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
    replicaCount: 1
