---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tuppr-notification
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: tuppr-notification
    template:
      data:
        url: pover://{{ index . "user-key" }}@{{ .token }}
  dataFrom:
    - extract:
        key: tuppr-pushover
