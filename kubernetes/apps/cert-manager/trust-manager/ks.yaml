---
# yaml-language-server: $schema=https://crd.kantai.xyz/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trust-manager
spec:
  dependsOn:
    - name: cert-manager
  path: ./kubernetes/apps/cert-manager/trust-manager/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: cert-manager-trust-manager
    namespace: flux-system
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 5m
---
# yaml-language-server: $schema=https://crd.kantai.xyz/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-ca-bundle
spec:
  dependsOn:
    - name: trust-manager
  path: ./kubernetes/apps/cert-manager/trust-manager/cluster-ca-bundle
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: cert-manager-trust-manager
    namespace: flux-system
  interval: 1h
  retryInterval: 2m
  timeout: 5m
