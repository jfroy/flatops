---
# yaml-language-server: $schema=https://crd.kantai.xyz/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "${APP}-oidc"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: "${APP}-oidc"
  data:
    - secretKey: client-id
      remoteRef:
        key: "${APP}-oidc"
        property: "client-id"
    - secretKey: client-secret
      remoteRef:
        key: "${APP}-oidc"
        property: "client-secret"
